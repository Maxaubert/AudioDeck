<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AudioDeck - Codex punk 2</title>
  <style>
    :root{
      --ink:#171715;
      --paper:#eee8d2;
      --paper-light:#f8f3df;
      --paper-dark:#d8d1b9;
      --marker:#f2e51b;
      --muted:#69675f;
      --disabled:#b8b3a3;
      --pole:#343531;
      --white:#fffdf2;
    }
    *{box-sizing:border-box}
    html{background:var(--pole)}
    body{
      margin:0;
      min-width:980px;
      color:var(--ink);
      font-family:"Arial Narrow","Roboto Condensed","Segoe UI",Arial,sans-serif;
      font-size:17px;
      line-height:1.25;
      background:
        linear-gradient(90deg,transparent 0 8%,rgba(0,0,0,.13) 8% 8.4%,transparent 8.4% 91%,rgba(255,255,255,.035) 91% 91.3%,transparent 91.3%),
        var(--pole);
    }
    button,select,input{font:inherit;color:inherit}
    button,select{cursor:pointer}
    button:focus-visible,select:focus-visible,input:focus-visible{
      outline:4px solid var(--marker);
      outline-offset:3px;
    }
    button:disabled{cursor:not-allowed}
    .stage{padding:18px 26px 28px}
    .flyer{
      position:relative;
      isolation:isolate;
      width:min(1200px,calc(100vw - 52px));
      margin:0 auto;
      background:var(--paper);
      border:2px solid var(--ink);
      clip-path:polygon(.2% .35%,99.75% 0,100% 98.7%,98.9% 99.1%,98.1% 98.72%,97.2% 99.18%,96.3% 98.8%,95.4% 99.2%,94.5% 98.82%,93.6% 99.14%,92.7% 98.79%,91.8% 99.16%,90.9% 98.83%,90% 99.2%,89.1% 98.78%,88.2% 99.15%,87.3% 98.81%,86.4% 99.18%,85.5% 98.8%,84.6% 99.16%,83.7% 98.82%,82.8% 99.2%,81.9% 98.8%,81% 99.17%,80.1% 98.83%,79.2% 99.18%,78.3% 98.8%,77.4% 99.16%,76.5% 98.82%,75.6% 99.17%,74.7% 98.8%,73.8% 99.18%,72.9% 98.82%,72% 99.19%,71.1% 98.8%,70.2% 99.17%,69.3% 98.81%,68.4% 99.18%,67.5% 98.82%,66.6% 99.17%,65.7% 98.8%,64.8% 99.18%,63.9% 98.82%,63% 99.18%,62.1% 98.8%,61.2% 99.17%,60.3% 98.82%,59.4% 99.18%,58.5% 98.81%,57.6% 99.17%,56.7% 98.82%,55.8% 99.18%,54.9% 98.8%,54% 99.16%,53.1% 98.82%,52.2% 99.18%,51.3% 98.8%,50.4% 99.17%,49.5% 98.82%,48.6% 99.18%,47.7% 98.81%,46.8% 99.16%,45.9% 98.83%,45% 99.18%,44.1% 98.8%,43.2% 99.17%,42.3% 98.82%,41.4% 99.18%,40.5% 98.8%,39.6% 99.17%,38.7% 98.82%,37.8% 99.18%,36.9% 98.8%,36% 99.17%,35.1% 98.81%,34.2% 99.18%,33.3% 98.82%,32.4% 99.17%,31.5% 98.8%,30.6% 99.18%,29.7% 98.82%,28.8% 99.18%,27.9% 98.8%,27% 99.17%,26.1% 98.82%,25.2% 99.18%,24.3% 98.8%,23.4% 99.17%,22.5% 98.82%,21.6% 99.18%,20.7% 98.81%,19.8% 99.17%,18.9% 98.82%,18% 99.18%,17.1% 98.8%,16.2% 99.17%,15.3% 98.82%,14.4% 99.18%,13.5% 98.81%,12.6% 99.17%,11.7% 98.82%,10.8% 99.18%,9.9% 98.8%,9% 99.17%,8.1% 98.82%,7.2% 99.18%,6.3% 98.8%,5.4% 99.17%,4.5% 98.82%,3.6% 99.18%,2.7% 98.81%,1.8% 99.18%,.9% 98.75%,0 99.1%);
    }
    .flyer:before{
      content:"";
      position:absolute;
      inset:0;
      z-index:-1;
      pointer-events:none;
      opacity:.38;
      background:
        repeating-linear-gradient(7deg,transparent 0 23px,rgba(23,23,21,.035) 23px 25px,transparent 25px 49px),
        repeating-linear-gradient(91deg,transparent 0 97px,rgba(23,23,21,.03) 97px 99px);
    }
    .curl{
      position:absolute;
      right:-1px;
      top:205px;
      width:25px;
      height:110px;
      z-index:8;
      background:var(--pole);
      clip-path:polygon(100% 0,100% 100%,0 86%,55% 54%,8% 8%);
      pointer-events:none;
    }
    .curl:after{
      content:"";
      position:absolute;
      inset:8px 0 15px 7px;
      background:var(--paper-dark);
      clip-path:polygon(100% 0,100% 100%,0 80%,55% 52%,0 8%);
    }
    .staple{
      position:absolute;
      z-index:20;
      width:30px;
      height:8px;
      border:3px solid #57574f;
      border-top-color:#9d9b8c;
      background:transparent;
      transform:rotate(-8deg);
      pointer-events:none;
    }
    .staple:after{
      content:"";
      position:absolute;
      left:3px;right:3px;top:8px;
      height:4px;
      border-left:4px solid rgba(23,23,21,.35);
      border-right:4px solid rgba(23,23,21,.35);
    }
    .staple.tl{top:13px;left:18px}
    .staple.tr{top:14px;right:19px;transform:rotate(7deg)}
    .staple.bl{bottom:20px;left:18px;transform:rotate(5deg)}
    .staple.br{bottom:19px;right:21px;transform:rotate(-5deg)}
    .appbar{
      min-height:88px;
      display:grid;
      grid-template-columns:292px 1fr auto;
      align-items:stretch;
      background:var(--ink);
      color:var(--paper-light);
      border-bottom:7px solid var(--marker);
      padding:0 36px 0 30px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:13px;
      min-width:0;
    }
    .mark{
      position:relative;
      width:49px;
      height:49px;
      border:4px solid currentColor;
      transform:rotate(-3deg);
      flex:0 0 auto;
    }
    .mark:before,.mark:after{
      content:"";
      position:absolute;
      top:7px;
      bottom:7px;
      width:7px;
      background:var(--marker);
      transform:skew(-11deg);
    }
    .mark:before{left:8px}
    .mark:after{right:8px;height:19px;top:21px}
    .mark i{
      position:absolute;
      left:20px;
      top:11px;
      width:7px;
      height:27px;
      background:var(--paper-light);
      transform:skew(-11deg);
    }
    .wordmark{
      font-family:Impact,"Arial Black","Arial Narrow",sans-serif;
      font-size:30px;
      line-height:.88;
      letter-spacing:.8px;
      text-transform:uppercase;
    }
    .wordmark span{display:block;color:var(--marker)}
    .tabs{
      display:flex;
      align-items:end;
      gap:4px;
      padding-top:20px;
    }
    .tab{
      min-width:116px;
      min-height:53px;
      border:0;
      border-left:2px solid var(--paper);
      background:transparent;
      color:var(--paper);
      padding:12px 18px 11px;
      font-family:Impact,"Arial Black","Arial Narrow",sans-serif;
      font-size:17px;
      letter-spacing:.8px;
      text-transform:uppercase;
      transition:transform 90ms linear,background 90ms linear,color 90ms linear;
    }
    .tab:hover{background:var(--paper);color:var(--ink);transform:translateY(-4px) rotate(-1deg)}
    .tab.active{background:var(--marker);color:var(--ink);transform:rotate(-1deg)}
    .status{
      display:flex;
      align-items:center;
      gap:9px;
      padding-left:22px;
      font-size:12px;
      font-weight:900;
      letter-spacing:1.1px;
      text-transform:uppercase;
      white-space:nowrap;
    }
    .pulse{width:12px;height:12px;background:var(--marker);transform:rotate(45deg)}
    main{padding:22px 34px 9px}
    .page{display:none}
    .page.active{display:block;animation:page-in 140ms steps(2,end)}
    @keyframes page-in{from{transform:translateX(-6px)}to{transform:none}}
    .utility-line{
      display:flex;
      align-items:center;
      gap:10px;
      margin:0 0 15px;
      color:var(--muted);
      font-size:13px;
      font-weight:800;
    }
    .utility-line:after{content:"";height:2px;background:var(--ink);flex:1;opacity:.24}
    .board{
      margin:0 0 21px;
      border:3px solid var(--ink);
      background:var(--paper-light);
    }
    .board-head{
      min-height:45px;
      display:flex;
      align-items:center;
      gap:12px;
      padding:0 15px;
      background:var(--ink);
      color:var(--paper-light);
    }
    .board-head h2{
      margin:0;
      font-family:Impact,"Arial Black","Arial Narrow",sans-serif;
      font-size:22px;
      font-weight:900;
      letter-spacing:1.6px;
      text-transform:uppercase;
    }
    .board-head small{
      color:var(--marker);
      font-size:12px;
      font-weight:900;
      letter-spacing:1.1px;
      text-transform:uppercase;
    }
    .board-head .dash{height:4px;flex:1;background:var(--paper-light);opacity:.28}
    .rows{padding:6px 8px 0}
    .device-row{
      display:grid;
      grid-template-columns:55px 48px minmax(290px,1fr) auto;
      align-items:center;
      min-height:73px;
      border-bottom:2px solid var(--ink);
      background:var(--paper-light);
      transition:background 90ms linear,transform 90ms linear;
    }
    .device-row:last-child{border-bottom:0}
    .device-row:hover{background:#e4ddc5;transform:translateX(3px)}
    .device-row.in-use{background:var(--marker)}
    .device-row.in-use:hover{background:#fff12f}
    .device-row.override{background:var(--ink);color:var(--paper-light)}
    .device-row.override:hover{background:#2f2f2b}
    .device-row.offline,.device-row.disabled{
      color:#3f3e39;
      background:var(--disabled);
    }
    .device-row.offline .device-copy small,.device-row.disabled .device-copy small{color:#46453f}
    .rank{
      font-family:Impact,"Arial Black","Arial Narrow",sans-serif;
      font-size:31px;
      text-align:center;
      line-height:1;
    }
    .glyph{display:grid;place-items:center}
    .glyph svg{
      width:28px;
      height:28px;
      fill:none;
      stroke:currentColor;
      stroke-width:2.25;
      stroke-linecap:square;
      stroke-linejoin:miter;
    }
    .device-copy{padding:9px 12px 9px 2px;min-width:0}
    .device-copy strong{
      display:flex;
      align-items:center;
      gap:9px;
      min-width:0;
      font-family:"Arial Narrow","Segoe UI",Arial,sans-serif;
      font-size:19px;
      font-weight:900;
      line-height:1.05;
    }
    .device-copy small{
      display:block;
      margin-top:5px;
      color:var(--muted);
      font-size:13px;
      font-weight:750;
    }
    .override .device-copy small{color:#d9d3bd}
    .badge{
      display:inline-block;
      flex:0 0 auto;
      padding:4px 7px 3px;
      background:var(--ink);
      color:var(--paper-light);
      font-size:10px;
      line-height:1;
      letter-spacing:1px;
      text-transform:uppercase;
      transform:rotate(-1deg);
    }
    .override .badge{background:var(--marker);color:var(--ink);transform:rotate(1deg)}
    .offline .badge{background:#68665f}
    .row-actions{display:flex;gap:4px;padding:0 10px}
    .icon-btn,.text-btn,.mute-btn{
      height:39px;
      border:2px solid currentColor;
      border-radius:0;
      background:transparent;
      font-weight:900;
      transition:background 80ms linear,color 80ms linear,transform 80ms linear;
    }
    .icon-btn{width:39px;padding:7px}
    .icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.5}
    .icon-btn:hover,.text-btn:hover,.mute-btn:hover{
      background:var(--ink);
      color:var(--paper-light);
      transform:rotate(-2deg);
    }
    .override .icon-btn:hover{background:var(--marker);color:var(--ink)}
    .add-device{
      width:calc(100% - 16px);
      min-height:47px;
      margin:7px 8px 8px;
      border:3px dashed var(--ink);
      border-radius:0;
      background:var(--paper);
      font-size:15px;
      font-weight:900;
      letter-spacing:.5px;
      text-align:left;
      padding:0 18px;
    }
    .add-device:hover{background:var(--marker);transform:rotate(-.15deg)}
    .fringe{
      position:relative;
      height:65px;
      display:grid;
      grid-template-columns:repeat(8,1fr);
      border-top:3px solid var(--ink);
      background:var(--paper);
    }
    .tear{
      position:relative;
      overflow:hidden;
      border-right:2px dashed var(--ink);
      background:var(--paper);
    }
    .tear:nth-child(2n){transform:rotate(.4deg);transform-origin:top}
    .tear span{
      position:absolute;
      left:50%;
      top:50%;
      width:58px;
      transform:translate(-50%,-50%) rotate(90deg);
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font-size:9px;
      font-weight:900;
      letter-spacing:.45px;
      text-transform:uppercase;
      text-align:center;
    }
    .tear.missing{
      background:var(--paper-light);
      clip-path:polygon(0 0,100% 0,91% 8%,83% 3%,74% 10%,64% 4%,54% 11%,44% 3%,35% 9%,25% 2%,14% 10%,4% 4%);
    }
    .tear.missing:after{
      content:"TAKEN";
      position:absolute;
      top:14px;left:50%;
      transform:translateX(-50%) rotate(-3deg);
      color:var(--muted);
      font-size:9px;
      font-weight:900;
      letter-spacing:1px;
    }
    .legend{
      display:flex;
      justify-content:flex-end;
      align-items:center;
      gap:16px;
      margin:-7px 1px 15px;
      font-size:11px;
      font-weight:900;
      letter-spacing:.5px;
      text-transform:uppercase;
    }
    .legend span{display:flex;align-items:center;gap:6px}
    .swatch{width:14px;height:14px;border:2px solid var(--ink);background:var(--marker)}
    .swatch.manual{background:var(--ink)}
    .mixer-row{grid-template-columns:55px 48px minmax(255px,1fr) minmax(230px,1fr) 68px 86px}
    .slider-wrap{display:flex;align-items:center;padding:0 16px}
    input[type="range"]{
      width:100%;
      height:25px;
      appearance:none;
      background:transparent;
    }
    input[type="range"]::-webkit-slider-runnable-track{height:7px;background:var(--ink)}
    input[type="range"]::-webkit-slider-thumb{
      appearance:none;
      width:18px;
      height:25px;
      margin-top:-9px;
      border:3px solid var(--ink);
      background:var(--marker);
    }
    input[type="range"]::-moz-range-track{height:7px;background:var(--ink)}
    input[type="range"]::-moz-range-thumb{width:14px;height:21px;border:3px solid var(--ink);border-radius:0;background:var(--marker)}
    .percent{
      font-family:Impact,"Arial Black","Arial Narrow",sans-serif;
      font-size:22px;
      text-align:right;
    }
    .mute-btn{margin:0 9px;padding:0 11px}
    .mute-btn.on{background:var(--ink);color:var(--marker)}
    .override .mute-btn.on{background:var(--marker);color:var(--ink)}
    .unavailable{padding-left:16px;color:#55534d;font-size:13px;font-weight:900;text-transform:uppercase}
    .manage-row{
      grid-template-columns:48px minmax(310px,1fr) 160px 94px 94px;
      padding:0 10px;
    }
    .manage-row .device-copy{padding-left:8px}
    .manage-row select,.setting select{
      height:39px;
      border:2px solid var(--ink);
      border-radius:0;
      background:var(--paper-light);
      padding:0 9px;
      font-weight:800;
    }
    .text-btn{margin-left:6px;padding:0 11px}
    .disabled .text-btn:last-child{background:var(--marker);color:var(--ink)}
    .remembered{
      min-height:51px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:15px;
      border:3px dashed var(--ink);
      padding:0 16px;
      font-weight:900;
    }
    .switch{
      position:relative;
      width:58px;
      height:31px;
      border:3px solid var(--ink);
      border-radius:0;
      background:var(--paper-dark);
      padding:0;
    }
    .switch:after{
      content:"";
      position:absolute;
      top:4px;left:4px;
      width:17px;height:17px;
      background:var(--ink);
      transition:transform 90ms linear;
    }
    .switch.on{background:var(--marker)}
    .switch.on:after{transform:translateX(26px)}
    .settings{
      display:grid;
      grid-template-columns:1fr 1fr 1.25fr;
      gap:3px;
      margin:4px 34px 31px;
      border:3px solid var(--ink);
      background:var(--ink);
    }
    .setting{
      min-height:59px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      background:var(--paper-light);
      padding:9px 14px;
      font-size:14px;
      font-weight:900;
    }
    .setting select{min-width:116px}
    .toast{
      position:fixed;
      right:26px;
      bottom:22px;
      z-index:50;
      max-width:310px;
      border:3px solid var(--marker);
      background:var(--ink);
      color:var(--paper-light);
      padding:13px 18px;
      font-weight:900;
      transform:translateY(120px) rotate(1deg);
      transition:transform 130ms steps(2,end);
    }
    .toast.show{transform:translateY(0) rotate(1deg)}
    @media(max-width:1050px){
      .appbar{grid-template-columns:242px 1fr auto;padding-right:22px}
      .tab{min-width:100px;padding-left:12px;padding-right:12px}
      .mixer-row{grid-template-columns:50px 42px minmax(220px,1fr) minmax(190px,1fr) 60px 80px}
      .manage-row{grid-template-columns:44px minmax(270px,1fr) 145px 88px 88px}
    }
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="stage">
    <div class="flyer">
      <i class="staple tl" aria-hidden="true"></i>
      <i class="staple tr" aria-hidden="true"></i>
      <i class="staple bl" aria-hidden="true"></i>
      <i class="staple br" aria-hidden="true"></i>
      <i class="curl" aria-hidden="true"></i>

      <header class="appbar">
        <div class="brand" aria-label="AudioDeck">
          <span class="mark" aria-hidden="true"><i></i></span>
          <span class="wordmark">Audio<span>Deck</span></span>
        </div>
        <nav class="tabs" aria-label="Main pages">
          <button class="tab active" data-page="priority" aria-selected="true">Priority</button>
          <button class="tab" data-page="mixer" aria-selected="false">Mixer</button>
          <button class="tab" data-page="devices" aria-selected="false">Devices</button>
        </nav>
        <div class="status"><i class="pulse" aria-hidden="true"></i>Auto on&nbsp; / &nbsp;2s</div>
      </header>

      <main>
        <section class="page active" id="priority" aria-label="Priority"></section>
        <section class="page" id="mixer" aria-label="Mixer"></section>
        <section class="page" id="devices" aria-label="Devices"></section>
      </main>

      <footer class="settings" aria-label="Settings">
        <div class="setting">
          <span>Start with Windows</span>
          <button class="switch on" role="switch" aria-checked="true" aria-label="Start with Windows"></button>
        </div>
        <div class="setting">
          <span>Pause automation</span>
          <button class="switch" role="switch" aria-checked="false" aria-label="Pause automation"></button>
        </div>
        <label class="setting">
          <span>Check devices every</span>
          <select aria-label="Device check interval">
            <option selected>2 seconds</option>
            <option>5 seconds</option>
            <option>10 seconds</option>
          </select>
        </label>
      </footer>
    </div>
  </div>
  <div class="toast" role="status" aria-live="polite"></div>

  <script>
    const outputDevices = [
      {name:"AirPods Pro",maker:"Apple",kind:"Headphones",state:"offline",badge:"Offline"},
      {name:"Arctis Nova Pro",maker:"Steelseries",kind:"Headset",state:"in-use",badge:"In use",volume:100},
      {name:"Quest",maker:"Meta",kind:"Headphones",volume:62},
      {name:"NVIDIA High Definition Audio",maker:"LG",kind:"TV",volume:45}
    ];
    const microphoneDevices = [
      {name:"Arctis Nova Pro Mic",maker:"Steelseries",kind:"Microphone",mic:true,volume:100},
      {name:"DJI MIC MINI",maker:"DJI",kind:"Wireless microphone",mic:true,state:"override",badge:"Manual override",volume:62}
    ];
    const byId = id => document.getElementById(id);

    function glyph(isMic, isTv = false){
      if(isTv) return `<span class="glyph" aria-hidden="true"><svg viewBox="0 0 32 32"><rect x="3" y="5" width="26" height="19"/><path d="M11 29h10M16 24v5"/></svg></span>`;
      if(isMic) return `<span class="glyph" aria-hidden="true"><svg viewBox="0 0 32 32"><rect x="11" y="3" width="10" height="18"/><path d="M7 15v1a9 9 0 0 0 18 0v-1M16 25v4M11 29h10"/></svg></span>`;
      return `<span class="glyph" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M5 18v-4a11 11 0 0 1 22 0v4M5 17h5v10H7a2 2 0 0 1-2-2zM27 17h-5v10h3a2 2 0 0 0 2-2z"/></svg></span>`;
    }

    function copy(device){
      return `<div class="device-copy"><strong>${device.name}${device.badge ? `<span class="badge">${device.badge}</span>` : ""}</strong><small>${device.maker} / ${device.kind}</small></div>`;
    }

    function moveButton(direction,label,path){
      return `<button class="icon-btn move" data-direction="${direction}" aria-label="${label}"><svg viewBox="0 0 20 20"><path d="${path}"/></svg></button>`;
    }

    function priorityRow(device,index){
      return `<article class="device-row ${device.state || ""}">
        <span class="rank">${index + 1}</span>
        ${glyph(device.mic,device.kind === "TV")}
        ${copy(device)}
        <div class="row-actions">
          ${moveButton(-1,"Move up","M4 12l6-6 6 6")}
          ${moveButton(1,"Move down","M4 8l6 6 6-6")}
          <button class="icon-btn remove" aria-label="Remove from ranking"><svg viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
        </div>
      </article>`;
    }

    function mixerRow(device,index){
      const control = device.state === "offline"
        ? `<div class="unavailable">Unavailable</div><span class="percent">--</span><button class="mute-btn" disabled>Mute</button>`
        : `<div class="slider-wrap"><input type="range" min="0" max="100" value="${device.volume}" aria-label="${device.name} volume"></div><span class="percent">${device.volume}%</span><button class="mute-btn">Mute</button>`;
      return `<article class="device-row mixer-row ${device.state || ""}">
        <span class="rank">${index + 1}</span>
        ${glyph(device.mic,device.kind === "TV")}
        ${copy(device)}
        ${control}
      </article>`;
    }

    function fringe(items){
      const names = items.map(item => item.name);
      const tickets = Array.from({length:8},(_,index) => {
        if(index === 5) return `<div class="tear missing" aria-label="Tear-off tab taken"></div>`;
        return `<div class="tear"><span>${names[index % names.length]}</span></div>`;
      }).join("");
      return `<div class="fringe" aria-hidden="true">${tickets}</div>`;
    }

    function priorityBoard(title,items){
      return `<section class="board">
        <header class="board-head"><h2>${title}</h2><small>${items.length} ranked</small><i class="dash"></i></header>
        <div class="rows">${items.map(priorityRow).join("")}</div>
        <button class="add-device">+ Add a device <span>(2 more)</span></button>
        ${fringe(items)}
      </section>`;
    }

    function mixerBoard(title,items){
      return `<section class="board">
        <header class="board-head"><h2>${title}</h2><small>${items.length} ranked</small><i class="dash"></i></header>
        <div class="rows">${items.map(mixerRow).join("")}</div>
        ${fringe(items)}
      </section>`;
    }

    byId("priority").innerHTML = `
      <p class="utility-line">Top available device becomes the Windows default.</p>
      ${priorityBoard("Outputs",outputDevices)}
      ${priorityBoard("Microphones",microphoneDevices)}
      <div class="legend" aria-label="Status legend">
        <span><i class="swatch"></i>In use</span>
        <span><i class="swatch manual"></i>Manual override</span>
      </div>`;

    byId("mixer").innerHTML = `
      <p class="utility-line">Levels are saved per device.</p>
      ${mixerBoard("Outputs",outputDevices)}
      ${mixerBoard("Microphones",microphoneDevices)}`;

    const allDevices = [
      ...outputDevices,
      ...microphoneDevices,
      {name:"Realtek Digital Output",maker:"Realtek",kind:"Speakers",state:"disabled",badge:"Disabled"}
    ];
    const types = ["Speakers","Headphones","Headset","TV"];
    function manageRow(device,index){
      const selected = device.kind === "TV" ? "TV" : device.kind === "Headset" ? "Headset" : device.kind === "Headphones" ? "Headphones" : "Speakers";
      return `<article class="device-row manage-row ${device.state === "offline" ? "offline" : device.state === "disabled" ? "disabled" : ""}">
        ${glyph(device.mic,device.kind === "TV")}
        ${copy(device)}
        <select aria-label="${device.name} type">${types.map(type => `<option${type === selected ? " selected" : ""}>${type}</option>`).join("")}</select>
        <button class="text-btn rename">Rename</button>
        <button class="text-btn disable">${device.state === "disabled" ? "Enable" : "Disable"}</button>
      </article>`;
    }
    byId("devices").innerHTML = `
      <p class="utility-line">All Windows audio endpoints.</p>
      <div class="remembered">
        <span>Show remembered devices (31)</span>
        <button class="switch" role="switch" aria-checked="false" aria-label="Show remembered devices"></button>
      </div>
      <section class="board">
        <header class="board-head"><h2>All endpoints</h2><small>${allDevices.length} found</small><i class="dash"></i></header>
        <div class="rows">${allDevices.map(manageRow).join("")}</div>
        ${fringe(allDevices)}
      </section>`;

    function toast(message){
      const element = document.querySelector(".toast");
      element.textContent = message;
      element.classList.add("show");
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => element.classList.remove("show"),1400);
    }

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click",() => {
        document.querySelectorAll(".tab").forEach(item => {
          item.classList.toggle("active",item === tab);
          item.setAttribute("aria-selected",item === tab ? "true" : "false");
        });
        document.querySelectorAll(".page").forEach(page => page.classList.toggle("active",page.id === tab.dataset.page));
      });
    });

    document.addEventListener("input",event => {
      if(event.target.matches('input[type="range"]')){
        event.target.closest(".device-row").querySelector(".percent").textContent = `${event.target.value}%`;
      }
    });

    document.addEventListener("click",event => {
      const button = event.target.closest("button");
      if(!button) return;
      if(button.classList.contains("switch")){
        const isOn = button.classList.toggle("on");
        button.setAttribute("aria-checked",String(isOn));
      }
      if(button.classList.contains("mute-btn") && !button.disabled){
        const isMuted = button.classList.toggle("on");
        button.textContent = isMuted ? "Muted" : "Mute";
      }
      if(button.classList.contains("move")){
        const row = button.closest(".device-row");
        const sibling = Number(button.dataset.direction) < 0 ? row.previousElementSibling : row.nextElementSibling;
        if(sibling){
          if(Number(button.dataset.direction) < 0) row.parentNode.insertBefore(row,sibling);
          else row.parentNode.insertBefore(sibling,row);
          [...row.parentNode.children].forEach((item,index) => item.querySelector(".rank").textContent = index + 1);
        }
      }
      if(button.classList.contains("remove")) toast("Removed from this ranking");
      if(button.classList.contains("add-device")) toast("Device picker opened");
      if(button.classList.contains("rename")){
        const name = button.closest(".device-row").querySelector(".device-copy strong");
        const current = name.childNodes[0].textContent;
        const next = window.prompt("Rename this Windows device",current);
        if(next && next.trim()){
          name.childNodes[0].textContent = next.trim();
          toast("Device renamed");
        }
      }
      if(button.classList.contains("disable")){
        const enabling = button.textContent.trim() === "Enable";
        button.textContent = enabling ? "Disable" : "Enable";
        button.closest(".device-row").classList.toggle("disabled",!enabling);
        toast(enabling ? "Device enabled" : "Device disabled");
      }
    });
  </script>
</body>
</html>
