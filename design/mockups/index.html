<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AudioDeck palette round</title>
<style>
  :root {
    --chrome: #16181d;
    --chrome-2: #1e2128;
    --line: #333844;
    --ink: #f2f4f8;
    --ink-dim: #a6aebd;
    --accent: #4ecdc4;
    --pink: #ef7bab;
    --ease: cubic-bezier(0.23, 1, 0.32, 1);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    display: flex;
    flex-direction: column;
    background: var(--chrome);
    color: var(--ink);
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    font-size: 17px;
  }

  header {
    display: flex;
    align-items: center;
    gap: 1.25rem;
    flex-wrap: wrap;
    padding: 0.85rem 1.4rem;
    background: var(--chrome-2);
    border-bottom: 1px solid var(--line);
  }

  .brand {
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    white-space: nowrap;
  }
  .brand span { color: var(--accent); }

  .picker { display: flex; align-items: center; gap: 0.55rem; flex: 1; min-width: 340px; }

  select {
    flex: 1;
    min-width: 250px;
    font: inherit;
    font-size: 1.05rem;
    padding: 0.6rem 0.9rem;
    color: var(--ink);
    background: var(--chrome);
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
  }
  select:hover { border-color: #4b5364; }
  optgroup { color: var(--ink-dim); font-style: normal; }

  button, .linkbtn {
    font: inherit;
    font-size: 1.05rem;
    line-height: 1;
    padding: 0.65rem 0.95rem;
    min-height: 44px;
    color: var(--ink);
    background: var(--chrome);
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    transition: border-color 140ms var(--ease), background 140ms var(--ease);
  }
  button:hover, .linkbtn:hover { border-color: #4b5364; background: #262a33; }
  button:active { transform: scale(0.98); }

  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .counter { font-variant-numeric: tabular-nums; color: var(--ink-dim); white-space: nowrap; }

  .meta {
    padding: 0.5rem 1.4rem;
    background: var(--chrome-2);
    border-bottom: 1px solid var(--line);
    color: var(--ink-dim);
    font-size: 0.97rem;
    display: flex;
    gap: 0.75rem;
    align-items: baseline;
    flex-wrap: wrap;
  }

  .tag {
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.2rem 0.5rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    white-space: nowrap;
  }
  .tag.codex { color: var(--pink); border-color: #5c2f45; }
  .tag.claude { color: var(--accent); border-color: #245c58; }
  .tag.kind { color: var(--ink-dim); }

  .stage { flex: 1; min-height: 0; background: #0b0c0f; }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }

  kbd {
    font: inherit;
    font-size: 0.84rem;
    padding: 0.1rem 0.35rem;
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 4px;
    color: var(--ink-dim);
  }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <header>
    <div class="brand">Punk<span>Deck</span> palettes</div>
    <div class="picker">
      <button id="prev" type="button" aria-label="Previous variation">&#9664;</button>
      <select id="pick" aria-label="Choose a variation"></select>
      <button id="next" type="button" aria-label="Next variation">&#9654;</button>
    </div>
    <span class="counter" id="counter"></span>
    <a class="linkbtn" id="open" href="#" target="_blank" rel="noopener">Open full page</a>
  </header>
  <div class="meta">
    <span class="tag" id="source">&nbsp;</span>
    <span class="tag kind" id="kind">&nbsp;</span>
    <span id="desc"></span>
    <span style="margin-left:auto"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> to browse</span>
  </div>
  <div class="stage">
    <iframe id="frame" title="Variation preview"></iframe>
  </div>

<script>
const MOCKUPS = [
  { file: "pal-amber.html", name: "Amber (chosen)", by: "claude", kind: "theme",
    desc: "The picked theme. Settings tab at the far right, no vertical accent rule, outputs and microphones on one colour scheme, no focus box while dragging a fader." },
  { file: "punk-marker.html", name: "Marker yellow (base)", by: "claude", kind: "palette",
    desc: "Same layout with the original yellow accent." },
  { file: "pal-safety.html", name: "Safety orange", by: "claude", kind: "palette",
    desc: "Construction orange. Warmer and louder than the yellow, still reads as warning language." },
  { file: "pal-flare.html", name: "Flare red", by: "claude", kind: "palette",
    desc: "Emergency red. Most aggressive of the set, in-use reads as alarm." },
  { file: "pal-shock.html", name: "Shock pink", by: "claude", kind: "palette",
    desc: "Riso pink. Keeps the punk print reference without the hazard connotation." },
  { file: "pal-violet.html", name: "Violet", by: "claude", kind: "palette",
    desc: "Cool and unusual for audio tooling; the only non-warm, non-tech option here." },
  { file: "pal-cyan.html", name: "Electric cyan", by: "claude", kind: "palette",
    desc: "Cold and technical. Reads more instrument panel than street poster." },
  { file: "pal-mint.html", name: "Mint", by: "claude", kind: "palette",
    desc: "Bright green-cyan. Signals live and healthy rather than warning." },
  { file: "pal-acid.html", name: "Acid green", by: "claude", kind: "palette",
    desc: "Harsh screen green. The most abrasive option, closest to terminal phosphor." },
  { file: "pal-bone.html", name: "Bone, no colour", by: "claude", kind: "palette",
    desc: "Accent removed entirely: pure black and white, states carried by weight alone." },
  { file: "pal-dark-marker.html", name: "Dark stock, marker", by: "claude", kind: "dark",
    desc: "Same layout on black paper. Yellow accent, cream ink, inverted rank slabs." },
  { file: "pal-dark-cyan.html", name: "Dark stock, cyan", by: "claude", kind: "dark",
    desc: "Dark polarity with the cold accent; the most night-friendly of the set." },
  { file: "pal-dark-flare.html", name: "Dark stock, flare", by: "claude", kind: "dark",
    desc: "Dark polarity with emergency red. Heaviest, most severe combination." },
  { file: "punk-hardcore.html", name: "Hardcore monochrome", by: "claude", kind: "major",
    desc: "Black and newsprint only, plus one blood red for the override. Now with a Settings tab." },
  { file: "punk-tight.html", name: "Tight cleanup", by: "claude", kind: "minor",
    desc: "The reference done right: hero killed, one thin title bar, rows compressed to 56px." },
  { file: "punk-quiet.html", name: "Punk grown up", by: "claude", kind: "minor",
    desc: "Same family made quiet: newsprint, one acid, decoration down to a cut edge and hairlines." },
  { file: "punk-sticker.html", name: "Sticker sheet", by: "claude", kind: "major",
    desc: "Die-cut stickers on release liner, every row rotated a fraction, peeling tab corners." },
  { file: "punk-xerox.html", name: "Third-gen photocopy", by: "claude", kind: "major",
    desc: "Blown-out toner edges, dither screens, copier streaks, grayscale plus fluoro pink." },
  { file: "punk-ransom.html", name: "Ransom note", by: "claude", kind: "major",
    desc: "Cut-letter collage on labels and tabs only; functional text stays clean and legible." },
  { file: "punk-jcard.html", name: "Cassette J-card", by: "claude", kind: "major",
    desc: "Tape insert layout: rotated spine strip, tape-window sections, marker annotations." },
  { file: "punk-gigposter.html", name: "Silkscreen gig poster", by: "claude", kind: "major",
    desc: "Two inks with deliberate offset overlap, diagonal band, halftone fills." },
  { file: "punk-riotgrrrl.html", name: "Riot grrrl collage", by: "claude", kind: "major",
    desc: "Hot pink and black, marker scrawl, hand-circled states, torn paper edges." },
  { file: "punk-dymo.html", name: "Dymo industrial", by: "claude", kind: "major",
    desc: "Embossed label-tape strips, oil grey and acid green, rack-machine feel." },
  { file: "codex-p1.html", name: "Tabloid classifieds", by: "codex", kind: "major",
    desc: "Newspaper classifieds grid: masthead strip, ruled columns, entries as small ads." },
  { file: "codex-p2.html", name: "Tear-off flyer", by: "codex", kind: "major",
    desc: "Stapled pole flyer with a fringe of tear-off tabs, one already taken." },
  { file: "codex-p3.html", name: "Spray stencil", by: "codex", kind: "major",
    desc: "Stencil-cut letterforms with bridges and overspray, cardboard and traffic orange." },
  { file: "codex-p4.html", name: "Mimeograph", by: "codex", kind: "major",
    desc: "Purple spirit-duplicator ink, bleed and ghosted second impression on cheap paper." },
  { file: "codex-p5.html", name: "Dot-matrix printout", by: "codex", kind: "major",
    desc: "Greenbar fanfold with sprocket strips, ribbon black and worn magenta." },
  { file: "codex-p6.html", name: "Blackletter paste-up", by: "codex", kind: "major",
    desc: "Gothic display type over layered torn posters, bone paper and oxblood." },
  { file: "codex-p7.html", name: "Anarcho woodcut", by: "codex", kind: "major",
    desc: "Carved gouged shapes, hatched shading, rough cream and one ink red." },
  { file: "codex-p8.html", name: "Hazard industrial", by: "codex", kind: "major",
    desc: "Warning-panel language: hazard striping, riveted plates, caution yellow and red." },
  { file: "codex-p9.html", name: "Wheatpaste layers", by: "codex", kind: "major",
    desc: "Generations of posters pasted over each other, older fragments peeking through." },
];

const pick = document.getElementById("pick");
const frame = document.getElementById("frame");
const counter = document.getElementById("counter");
const sourceTag = document.getElementById("source");
const kindTag = document.getElementById("kind");
const desc = document.getElementById("desc");
const openLink = document.getElementById("open");

const groups = { claude: "Claude", codex: "Codex" };
for (const [key, label] of Object.entries(groups)) {
  const og = document.createElement("optgroup");
  og.label = label;
  MOCKUPS.forEach((m, i) => {
    if (m.by !== key) return;
    const opt = document.createElement("option");
    opt.value = String(i);
    opt.textContent = m.name + (m.kind ? "  (" + m.kind + ")" : "");
    og.appendChild(opt);
  });
  pick.appendChild(og);
}

let index = 0;

function show(i) {
  index = (i + MOCKUPS.length) % MOCKUPS.length;
  const m = MOCKUPS[index];
  frame.src = m.file;
  pick.value = String(index);
  counter.textContent = (index + 1) + " / " + MOCKUPS.length;
  sourceTag.textContent = m.by === "codex" ? "Codex" : "Claude";
  sourceTag.className = "tag " + m.by;
  kindTag.textContent = m.kind || "variation";
  desc.textContent = m.desc;
  openLink.href = m.file;
  location.hash = m.file.replace(".html", "");
}

pick.addEventListener("change", () => show(Number(pick.value)));
document.getElementById("prev").addEventListener("click", () => show(index - 1));
document.getElementById("next").addEventListener("click", () => show(index + 1));
document.addEventListener("keydown", (e) => {
  if (e.target === pick) return;
  if (e.key === "ArrowLeft") show(index - 1);
  if (e.key === "ArrowRight") show(index + 1);
});

const fromHash = MOCKUPS.findIndex((m) => m.file.replace(".html", "") === location.hash.slice(1));
show(fromHash >= 0 ? fromHash : 0);
</script>
</body>
</html>
