<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AudioDeck - Codex 8</title>
  <style>
    :root{--white:#ffffff;--wash:#f1f5f2;--ink:#18201d;--muted:#66716c;--line:#c8d1cc;--green:#0b6b52;--clay:#aa4b2b}
    *{box-sizing:border-box}body{margin:0;background:#e7ece9;color:var(--ink);font:18px/1.5 Calibri,"Segoe UI",Arial,sans-serif;min-width:780px}button,select,input{font:inherit;color:inherit}button,select{cursor:pointer}:focus-visible{outline:3px solid var(--clay);outline-offset:4px}
    .shell{width:min(1240px,calc(100% - 48px));margin:24px auto;background:var(--white);display:grid;grid-template-columns:224px 1fr;border:1px solid #b8c2bd}
    header{grid-column:1;grid-row:1;background:var(--wash);border-right:1px solid var(--line);padding:38px 25px;display:flex;flex-direction:column;min-height:850px}
    .brand{display:block}.mark{width:54px;height:54px;display:block;position:relative;margin-bottom:22px}.mark:before,.mark:after{content:"";position:absolute;border:3px solid var(--ink);border-radius:50%}.mark:before{width:46px;height:46px;left:0;top:0}.mark:after{width:17px;height:17px;left:15px;top:15px;background:var(--green);border-color:var(--green)}.mark i{position:absolute;width:2px;height:54px;background:var(--ink);left:48px;transform:rotate(25deg);transform-origin:center}
    .wordmark{font:800 27px/1 Arial,sans-serif;letter-spacing:-1px}.wordmark small{display:block;margin-top:9px;font:700 11px/1.3 Arial,sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:1.7px}
    nav{margin-top:75px;display:flex;flex-direction:column;gap:3px}.tab{border:0;border-left:4px solid transparent;background:transparent;text-align:left;padding:15px 16px;font-weight:750;font-size:19px}.tab:hover{background:#e1e9e4}.tab.active{border-left-color:var(--green);background:var(--white);color:var(--green)}
    .system-state{margin-top:auto;color:var(--muted);font-size:14px}.system-state:before{content:"";display:block;width:10px;height:10px;border-radius:50%;background:var(--green);margin-bottom:10px}.system-state strong{display:block;color:var(--ink);font-size:15px}
    main{grid-column:2;grid-row:1;padding:51px 55px 22px;min-width:0}.page{display:none}.page.active{display:block}.intro{max-width:760px;margin-bottom:50px}.eyebrow{display:block;color:var(--green);font:800 12px/1 Arial,sans-serif;letter-spacing:2.1px;text-transform:uppercase;margin-bottom:18px}.intro h1{font:400 clamp(42px,5vw,66px)/1.02 Arial,sans-serif;letter-spacing:-3.5px;margin:0 0 18px}.intro p{margin:0;font-size:20px;color:#35413c}
    .section{margin-bottom:46px}.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px}.section-head h2{font:800 14px/1 Arial,sans-serif;letter-spacing:2px;margin:0;color:var(--muted)}.section-head span{font-size:14px;color:var(--muted)}
    .device-row{display:grid;grid-template-columns:54px 45px minmax(250px,1fr) auto;align-items:center;min-height:91px;border-bottom:1px solid var(--line);position:relative;transition:background .12s}.device-row:hover{background:var(--wash)}.device-row.in-use{background:var(--green);color:white;border-color:var(--green)}.device-row.override{background:var(--clay);color:white;border-color:var(--clay)}.device-row.offline{color:#8b948f;background:#f1f2f1}
    .rank{font:500 26px/1 Arial,sans-serif;color:var(--muted);text-align:center}.in-use .rank,.override .rank{color:white}.glyph{display:grid;place-items:center}.glyph svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}.device-name{padding:12px}.device-name strong{font-size:20px;font-weight:700;line-height:1.12}.device-name small{display:block;margin-top:6px;font-size:14px;color:var(--muted)}.in-use .device-name small,.override .device-name small{color:#fff;opacity:.78}.badge{margin-left:9px;font:800 10px/1 Arial,sans-serif;letter-spacing:1px;border:1px solid currentColor;padding:4px 6px;vertical-align:2px}
    .row-actions{display:flex;gap:3px;padding-right:8px}.icon-btn,.text-btn{min-width:43px;height:43px;border:0;background:transparent}.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}.icon-btn:hover,.text-btn:hover{background:var(--ink);color:white}.in-use .icon-btn:hover,.override .icon-btn:hover{background:white;color:var(--ink)}
    .add-device{width:100%;height:64px;margin-top:15px;background:transparent;border:1px dashed var(--muted);text-align:left;padding:0 20px;font-weight:700;color:var(--green)}.add-device:hover{border-color:var(--green);background:var(--wash)}
    .legend{display:flex;gap:28px;color:var(--muted);font-size:14px;margin:12px 0 18px}.legend span{display:flex;align-items:center;gap:9px}.swatch{width:13px;height:13px;border-radius:50%;background:var(--green)}.swatch.manual{background:var(--clay)}
    .mixer-row{grid-template-columns:54px 45px minmax(230px,1fr) minmax(220px,1fr) 68px 80px}.mix-control{padding:0 18px}.mix-control input{width:100%;accent-color:var(--green)}.override input{accent-color:white}.percent{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}.mute{height:42px;border:0;background:transparent;margin-left:8px}.mute:hover,.mute.on{background:var(--ink);color:white}
    .device-manage{grid-template-columns:45px minmax(250px,1fr) 160px 88px 90px;padding-left:10px}.device-manage select{width:148px;padding:9px;border:1px solid var(--line);background:white;color:var(--ink)}.device-manage .text-btn{font-size:15px}.disabled-device{background:#f1f2f1;color:#757e79}
    .note{border-top:1px solid var(--green);border-bottom:1px solid var(--green);padding:17px 0;margin-bottom:25px;color:var(--green);font-weight:700}.remembered{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid var(--line);margin-bottom:32px;font-weight:700}
    .switch{width:54px;height:30px;border:1px solid var(--muted);border-radius:18px;background:white;padding:3px}.switch:after{content:"";display:block;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .15s}.switch.on{border-color:var(--green)}.switch.on:after{background:var(--green);transform:translateX(24px)}
    .settings{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1.25fr;border-top:1px solid var(--line);background:var(--white)}.setting{min-height:82px;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:17px 26px;border-right:1px solid var(--line);font-weight:700}.setting:last-child{border:0}.setting select{border:1px solid var(--line);background:white;padding:9px}
    .toast{position:fixed;right:28px;bottom:28px;background:var(--ink);color:white;padding:13px 19px;opacity:0;transform:translateY(10px);transition:.15s}.toast.show{opacity:1;transform:none}
    @media(max-width:940px){.shell{width:calc(100% - 18px);margin:9px;grid-template-columns:190px 1fr}main{padding:42px 30px 18px}.mixer-row{grid-template-columns:48px 42px 1fr 170px 60px 70px}.device-manage{grid-template-columns:42px 1fr 138px 75px 78px}.settings{grid-template-columns:1fr}.setting{border-right:0;border-bottom:1px solid var(--line)}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand"><span class="mark" aria-hidden="true"><i></i></span><div class="wordmark">AudioDeck<small>Quiet control</small></div></div>
    <nav aria-label="Main pages"><button class="tab active" data-page="priority">Priority</button><button class="tab" data-page="mixer">Mixer</button><button class="tab" data-page="devices">Devices</button></nav>
    <div class="system-state"><strong>Automation is active</strong>Checking every 2 seconds</div>
  </header>
  <main><section id="priority" class="page active"></section><section id="mixer" class="page"></section><section id="devices" class="page"></section></main>
  <footer class="settings">
    <div class="setting"><span>Start with Windows</span><button class="switch on" role="switch" aria-checked="true" aria-label="Start with Windows"></button></div>
    <div class="setting"><span>Pause automation</span><button class="switch" role="switch" aria-checked="false" aria-label="Pause automation"></button></div>
    <label class="setting">Check devices every <select aria-label="Device check interval"><option selected>2 seconds</option><option>5 seconds</option><option>10 seconds</option></select></label>
  </footer>
</div>
<div class="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),outputs=[{name:'AirPods Pro',sub:'Apple · Headphones',state:'offline',status:'OFFLINE'},{name:'Arctis Nova Pro',sub:'Steelseries · Headset',state:'in-use',status:'IN USE',vol:100},{name:'Quest',sub:'Meta · Headphones',vol:62},{name:'NVIDIA High Definition Audio',sub:'LG · TV',vol:45}],microphones=[{name:'Arctis Nova Pro Mic',sub:'Steelseries · Microphone',vol:100,mic:true},{name:'DJI MIC MINI',sub:'DJI · Wireless microphone',state:'override',status:'MANUAL OVERRIDE',vol:62,mic:true}];
const icon=t=>`<span class="glyph" aria-hidden="true"><svg viewBox="0 0 32 32">${t?'<rect x="11" y="3" width="10" height="18" rx="5"/><path d="M7 15v1a9 9 0 0 0 18 0v-1M16 25v4M11 29h10"/>':'<path d="M5 18v-4a11 11 0 0 1 22 0v4M5 17h5v10H7a2 2 0 0 1-2-2zM27 17h-5v10h3a2 2 0 0 0 2-2z"/>'}</svg></span>`;
const ctl=(p,l)=>`<button class="icon-btn ${l==='Remove'?'remove':'move'}" ${l!=='Remove'?`data-dir="${l==='Move up'?'-1':'1'}"`:''} aria-label="${l}" title="${l}"><svg viewBox="0 0 20 20"><path d="${p}"/></svg></button>`,actions=()=>`<div class="row-actions">${ctl('M4 12l6-6 6 6','Move up')}${ctl('M4 8l6 6 6-6','Move down')}${ctl('M5 5l10 10M15 5L5 15','Remove')}</div>`;
function pRow(d,i){return `<article class="device-row ${d.state||''}" draggable="${d.state!=='offline'}"><span class="rank">${String(i+1).padStart(2,'0')}</span>${icon(d.mic)}<div class="device-name"><strong>${d.name}${d.status?`<span class="badge">${d.status}</span>`:''}</strong><small>${d.sub}</small></div>${actions()}</article>`}
function mRow(d,i){return `<article class="device-row mixer-row ${d.state||''}"><span class="rank">${String(i+1).padStart(2,'0')}</span>${icon(d.mic)}<div class="device-name"><strong>${d.name}${d.status?`<span class="badge">${d.status}</span>`:''}</strong><small>${d.sub}</small></div>${d.state==='offline'?'<div class="mix-control"><b>Unavailable</b></div><span class="percent">--</span><button class="mute" disabled>Mute</button>':`<div class="mix-control"><input type="range" min="0" max="100" value="${d.vol}" aria-label="${d.name} volume"></div><span class="percent">${d.vol}%</span><button class="mute">Mute</button>`}</article>`}
function block(title,items,mode){return `<section class="section"><div class="section-head"><h2>${title}</h2><span>${items.length} ranked devices</span></div><div class="rows">${items.map((d,i)=>mode==='mix'?mRow(d,i):pRow(d,i)).join('')}</div>${mode==='priority'?'<button class="add-device">+ Add a device (2 more)</button>':''}</section>`}
$('#priority').innerHTML=`<div class="intro"><span class="eyebrow">Priority order</span><h1>Sound follows the first available line.</h1><p>The highest available device automatically becomes the Windows default. Click a row to switch to it now. Drag to reorder.</p></div>${block('OUTPUTS',outputs,'priority')}${block('MICROPHONES',microphones,'priority')}<div class="legend"><span><i class="swatch"></i> Automatic, in use</span><span><i class="swatch manual"></i> Manual override</span></div>`;
$('#mixer').innerHTML=`<div class="intro"><span class="eyebrow">Device levels</span><h1>One measured level for every endpoint.</h1><p>Volume stays with each ranked device as Windows moves between them.</p></div>${block('OUTPUTS',outputs,'mix')}${block('MICROPHONES',microphones,'mix')}`;
const all=[...outputs,...microphones,{name:'Realtek Digital Output',sub:'Realtek · Disabled endpoint',state:'disabled-device'}],types=['Speakers','Headphones','Headset','TV'];
$('#devices').innerHTML=`<div class="intro"><span class="eyebrow">Endpoint library</span><h1>Everything connected, named clearly.</h1><p>Review current, offline, and disabled audio endpoints in one place.</p></div><div class="note">Renames apply to Windows itself, so the new name appears in other audio menus too.</div><div class="remembered"><span>Show remembered devices (31)</span><button class="switch" role="switch" aria-checked="false" aria-label="Show remembered devices"></button></div><section class="section"><div class="section-head"><h2>ALL ENDPOINTS</h2><span>${all.length} on this PC</span></div>${all.map((d,i)=>`<article class="device-row device-manage ${d.state||''}">${icon(d.mic)}<div class="device-name"><strong>${d.name}</strong><small>${d.sub}</small></div><select aria-label="${d.name} device type">${types.map((x,n)=>`<option ${n===i%4?'selected':''}>${x}</option>`).join('')}</select><button class="text-btn rename">Rename</button><button class="text-btn disable">${d.name.includes('Realtek')?'Enable':'Disable'}</button></article>`).join('')}</section>`;
const flash=m=>{const t=$('.toast');t.textContent=m;t.classList.add('show');clearTimeout(window.n);window.n=setTimeout(()=>t.classList.remove('show'),1300)};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.page').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.page).classList.add('active')});
document.addEventListener('input',e=>{if(e.target.type==='range')e.target.closest('.device-row').querySelector('.percent').textContent=e.target.value+'%'});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.classList.contains('switch')){b.classList.toggle('on');b.setAttribute('aria-checked',b.classList.contains('on'))}if(b.classList.contains('mute')){b.classList.toggle('on');b.textContent=b.classList.contains('on')?'Muted':'Mute'}if(b.classList.contains('rename')){const n=b.closest('.device-row').querySelector('strong'),v=prompt('Rename this Windows device',n.textContent);if(v){n.textContent=v;flash('Device renamed in Windows')}}if(b.classList.contains('disable')){b.textContent=b.textContent==='Enable'?'Disable':'Enable';flash('Device setting updated')}if(b.classList.contains('remove'))flash('Device removed from this ranking');if(b.classList.contains('move')){const r=b.closest('.device-row'),s=+b.dataset.dir<0?r.previousElementSibling:r.nextElementSibling;if(s)+b.dataset.dir<0?r.parentNode.insertBefore(r,s):r.parentNode.insertBefore(s,r)}})
</script>
</body>
</html>
