<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AudioDeck - Codex 9</title>
  <style>
    :root{--wine:#2b1018;--wine2:#421723;--ivory:#fff4d4;--gold:#dfc278;--teal:#16766f;--ruby:#a63448;--dim:#b6a98c;--black:#16090d}
    *{box-sizing:border-box}body{margin:0;background:var(--black);color:var(--ivory);font:18px/1.48 "Segoe UI",Arial,sans-serif;min-width:780px}button,select,input{font:inherit;color:inherit}button,select{cursor:pointer}:focus-visible{outline:4px solid var(--ivory);outline-offset:4px}
    .shell{width:min(1220px,calc(100% - 52px));margin:26px auto;background:var(--wine);border:2px solid var(--gold);position:relative}.shell:before{content:"";position:absolute;inset:9px;border:1px solid #7f663a;pointer-events:none}
    header{position:relative;text-align:center;padding:25px 42px 0;border-bottom:2px solid var(--gold);min-height:205px}.brand-line{display:flex;align-items:center;justify-content:center;gap:20px}.brand-line:before,.brand-line:after{content:"";height:2px;background:var(--gold);width:200px}.diamond{width:14px;height:14px;background:var(--gold);transform:rotate(45deg)}
    .crest{width:102px;height:78px;margin:0 auto 8px;position:relative;border:3px solid var(--gold);border-bottom:0;border-radius:52px 52px 0 0}.crest:before{content:"";position:absolute;width:61px;height:39px;border:2px solid var(--gold);border-bottom:0;border-radius:35px 35px 0 0;left:17px;bottom:0}.crest:after{content:"";position:absolute;width:12px;height:49px;background:var(--ruby);left:42px;bottom:0}.crest i,.crest b{position:absolute;display:block;bottom:0}.crest i{width:6px;height:38px;background:var(--teal);left:67px}.crest b{width:5px;height:27px;background:var(--gold);left:24px}
    .wordmark{font:700 35px/.95 Georgia,serif;letter-spacing:8px;text-transform:uppercase}.wordmark small{display:block;margin-top:8px;font:600 10px/1 Arial,sans-serif;letter-spacing:4px;color:var(--gold)}
    nav{display:flex;justify-content:center;gap:6px;margin-top:22px}.tab{min-width:160px;border:1px solid var(--gold);border-bottom:0;background:var(--wine2);color:var(--ivory);padding:15px 24px 18px;font:800 15px/1 "Arial Narrow",Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%,0 8px)}.tab:hover{background:var(--gold);color:var(--wine)}.tab.active{background:var(--ivory);color:var(--wine);position:relative}.tab.active:after{content:"";position:absolute;width:8px;height:8px;background:var(--ruby);left:calc(50% - 4px);bottom:5px;transform:rotate(45deg)}
    main{padding:46px 49px 22px}.page{display:none}.page.active{display:block}.intro{text-align:center;max-width:900px;margin:0 auto 48px}.folio{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--gold);font:800 11px/1 Arial,sans-serif;letter-spacing:3px;text-transform:uppercase}.folio:before,.folio:after{content:"";width:65px;height:1px;background:var(--gold)}.intro h1{margin:19px 0 15px;font:500 clamp(40px,5vw,64px)/1.02 Georgia,serif;letter-spacing:1px}.intro p{margin:0 auto;max-width:810px;font-size:20px;color:#f4e7c5}
    .section{margin-bottom:38px}.section-head{height:52px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px}.section-head:before,.section-head:after{content:"";height:1px;background:var(--gold)}.section-head h2{margin:0;color:var(--gold);font:800 14px/1 Arial,sans-serif;letter-spacing:3px}.section-head span{display:none}
    .device-row{display:grid;grid-template-columns:70px 50px minmax(270px,1fr) auto;align-items:center;min-height:94px;border-top:1px solid #765637;position:relative;transition:background .14s}.device-row:last-child{border-bottom:1px solid #765637}.device-row:hover{background:var(--wine2)}.device-row:before{content:"";position:absolute;left:14px;top:calc(50% - 5px);width:10px;height:10px;border:1px solid var(--gold);transform:rotate(45deg)}.device-row.in-use{background:var(--teal);color:white}.device-row.override{background:var(--ruby);color:white}.device-row.offline{background:#3a3030;color:#91897b}
    .rank{font:500 28px/1 Georgia,serif;text-align:right;padding-right:13px;color:var(--gold)}.in-use .rank,.override .rank{color:white}.glyph{display:grid;place-items:center}.glyph svg{width:29px;height:29px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}.device-name{padding:14px 8px}.device-name strong{font:700 20px/1.15 "Segoe UI",sans-serif}.device-name small{display:block;margin-top:7px;font-size:14px;color:var(--dim)}.in-use .device-name small,.override .device-name small{color:white;opacity:.8}.badge{display:inline-block;margin-left:9px;border:1px solid currentColor;padding:4px 7px;font:800 10px/1 Arial,sans-serif;letter-spacing:1.3px}
    .row-actions{display:flex;gap:6px;padding-right:14px}.icon-btn,.text-btn{height:43px;min-width:43px;border:1px solid var(--gold);background:transparent;color:var(--ivory)}.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}.icon-btn:hover,.text-btn:hover{background:var(--gold);color:var(--wine)}.in-use .icon-btn,.override .icon-btn{border-color:white}.in-use .icon-btn:hover,.override .icon-btn:hover{background:white;color:var(--wine)}
    .add-device{width:100%;height:66px;margin-top:15px;border:1px dashed var(--gold);background:transparent;color:var(--gold);font-weight:800;letter-spacing:.5px}.add-device:hover{background:var(--ivory);color:var(--wine)}
    .legend{display:flex;justify-content:center;gap:31px;color:var(--dim);font-size:14px;margin:18px 0}.legend span{display:flex;align-items:center;gap:10px}.swatch{width:20px;height:20px;background:var(--teal);transform:rotate(45deg)}.swatch.manual{background:var(--ruby)}
    .mixer-row{grid-template-columns:70px 50px minmax(240px,1fr) minmax(240px,1fr) 70px 88px}.mix-control{padding:0 17px}.mix-control input{width:100%;accent-color:var(--gold)}.percent{text-align:right;font:700 20px/1 Georgia,serif;color:var(--gold)}.in-use .percent,.override .percent{color:white}.mute{height:43px;border:1px solid var(--gold);background:transparent;color:var(--ivory);margin-left:10px}.mute:hover,.mute.on{background:var(--gold);color:var(--wine)}
    .device-manage{grid-template-columns:55px minmax(270px,1fr) 165px 95px 95px;padding:0 14px}.device-manage:before{display:none}.device-manage select{width:150px;padding:9px;background:var(--black);border:1px solid var(--gold);color:var(--ivory)}.device-manage option{background:var(--black)}.disabled-device{background:#3a3030;color:#9a9080}
    .note{text-align:center;border:1px solid var(--gold);padding:17px 22px;margin-bottom:22px;color:var(--gold);font-weight:700;clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px)}.remembered{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #765637;border-bottom:1px solid #765637;padding:16px 20px;margin-bottom:25px;font-weight:700}
    .switch{width:60px;height:32px;border:1px solid var(--gold);background:transparent;padding:4px}.switch:after{content:"";display:block;width:22px;height:22px;background:var(--dim);transition:transform .15s}.switch.on:after{background:var(--gold);transform:translateX(28px)}
    .settings{display:grid;grid-template-columns:1fr 1fr 1.3fr;background:var(--gold);color:var(--wine);border-top:2px solid var(--gold);margin:0 10px 10px}.setting{min-height:82px;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:15px;border-right:1px solid var(--wine);font-weight:800}.setting:last-child{border:0}.setting .switch{border-color:var(--wine)}.setting .switch:after{background:var(--wine)}.setting select{border:1px solid var(--wine);background:var(--ivory);padding:9px}
    .toast{position:fixed;right:27px;bottom:27px;background:var(--ivory);color:var(--wine);border:2px solid var(--gold);padding:14px 21px;font-weight:800;opacity:0;transition:.15s}.toast.show{opacity:1}
    @media(max-width:930px){.shell{width:calc(100% - 18px);margin:9px}main{padding:42px 30px 18px}.mixer-row{grid-template-columns:60px 44px 1fr 180px 58px 76px}.device-manage{grid-template-columns:45px 1fr 140px 80px 80px}.settings{grid-template-columns:1fr}.setting{border-right:0;border-bottom:1px solid var(--wine)}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
<div class="shell">
  <header>
    <div class="crest" aria-hidden="true"><i></i><b></b></div><div class="brand-line"><span class="diamond"></span><div class="wordmark">AudioDeck<small>Windows sound director</small></div><span class="diamond"></span></div>
    <nav aria-label="Main pages"><button class="tab active" data-page="priority">Priority</button><button class="tab" data-page="mixer">Mixer</button><button class="tab" data-page="devices">Devices</button></nav>
  </header>
  <main><section id="priority" class="page active"></section><section id="mixer" class="page"></section><section id="devices" class="page"></section></main>
  <footer class="settings">
    <div class="setting"><span>Start with Windows</span><button class="switch on" role="switch" aria-checked="true" aria-label="Start with Windows"></button></div>
    <div class="setting"><span>Pause automation</span><button class="switch" role="switch" aria-checked="false" aria-label="Pause automation"></button></div>
    <label class="setting">Check devices every <select aria-label="Device check interval"><option selected>2 seconds</option><option>5 seconds</option><option>10 seconds</option></select></label>
  </footer>
</div>
<div class="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),outputs=[{name:'AirPods Pro',sub:'Apple · Headphones',state:'offline',status:'OFFLINE'},{name:'Arctis Nova Pro',sub:'Steelseries · Headset',state:'in-use',status:'IN USE',vol:100},{name:'Quest',sub:'Meta · Headphones',vol:62},{name:'NVIDIA High Definition Audio',sub:'LG · TV',vol:45}],microphones=[{name:'Arctis Nova Pro Mic',sub:'Steelseries · Microphone',vol:100,mic:true},{name:'DJI MIC MINI',sub:'DJI · Wireless microphone',state:'override',status:'MANUAL OVERRIDE',vol:62,mic:true}];
const icon=t=>`<span class="glyph" aria-hidden="true"><svg viewBox="0 0 32 32">${t?'<rect x="11" y="3" width="10" height="18" rx="5"/><path d="M7 15v1a9 9 0 0 0 18 0v-1M16 25v4M11 29h10"/>':'<path d="M5 18v-4a11 11 0 0 1 22 0v4M5 17h5v10H7a2 2 0 0 1-2-2zM27 17h-5v10h3a2 2 0 0 0 2-2z"/>'}</svg></span>`;
const ctl=(p,l)=>`<button class="icon-btn ${l==='Remove'?'remove':'move'}" ${l!=='Remove'?`data-dir="${l==='Move up'?'-1':'1'}"`:''} aria-label="${l}" title="${l}"><svg viewBox="0 0 20 20"><path d="${p}"/></svg></button>`,actions=()=>`<div class="row-actions">${ctl('M4 12l6-6 6 6','Move up')}${ctl('M4 8l6 6 6-6','Move down')}${ctl('M5 5l10 10M15 5L5 15','Remove')}</div>`;
function pRow(d,i){return `<article class="device-row ${d.state||''}" draggable="${d.state!=='offline'}"><span class="rank">${i+1}</span>${icon(d.mic)}<div class="device-name"><strong>${d.name}${d.status?`<span class="badge">${d.status}</span>`:''}</strong><small>${d.sub}</small></div>${actions()}</article>`}
function mRow(d,i){return `<article class="device-row mixer-row ${d.state||''}"><span class="rank">${i+1}</span>${icon(d.mic)}<div class="device-name"><strong>${d.name}${d.status?`<span class="badge">${d.status}</span>`:''}</strong><small>${d.sub}</small></div>${d.state==='offline'?'<div class="mix-control"><b>Unavailable</b></div><span class="percent">--</span><button class="mute" disabled>Mute</button>':`<div class="mix-control"><input type="range" min="0" max="100" value="${d.vol}" aria-label="${d.name} volume"></div><span class="percent">${d.vol}%</span><button class="mute">Mute</button>`}</article>`}
function block(title,items,mode){return `<section class="section"><div class="section-head"><h2>${title}</h2><span>${items.length} ranked</span></div><div class="rows">${items.map((d,i)=>mode==='mix'?mRow(d,i):pRow(d,i)).join('')}</div>${mode==='priority'?'<button class="add-device">+ Add a device (2 more)</button>':''}</section>`}
$('#priority').innerHTML=`<div class="intro"><span class="folio">Programme I</span><h1>The first available device takes the stage.</h1><p>The highest available device automatically becomes the Windows default. Click a row to switch to it now. Drag to reorder.</p></div>${block('OUTPUTS',outputs,'priority')}${block('MICROPHONES',microphones,'priority')}<div class="legend"><span><i class="swatch"></i> Automatic, in use</span><span><i class="swatch manual"></i> Manual override</span></div>`;
$('#mixer').innerHTML=`<div class="intro"><span class="folio">Programme II</span><h1>Conduct every level from one place.</h1><p>Volume stays with each ranked endpoint, ready whenever Windows selects it.</p></div>${block('OUTPUTS',outputs,'mix')}${block('MICROPHONES',microphones,'mix')}`;
const all=[...outputs,...microphones,{name:'Realtek Digital Output',sub:'Realtek · Disabled endpoint',state:'disabled-device'}],types=['Speakers','Headphones','Headset','TV'];
$('#devices').innerHTML=`<div class="intro"><span class="folio">Programme III</span><h1>Every endpoint on the programme.</h1><p>Review the full cast of active, offline, and disabled Windows audio devices.</p></div><div class="note">Renames apply to Windows itself, so the new name appears in other audio menus too.</div><div class="remembered"><span>Show remembered devices (31)</span><button class="switch" role="switch" aria-checked="false" aria-label="Show remembered devices"></button></div><section class="section"><div class="section-head"><h2>ALL ENDPOINTS</h2><span>${all.length} found</span></div>${all.map((d,i)=>`<article class="device-row device-manage ${d.state||''}">${icon(d.mic)}<div class="device-name"><strong>${d.name}</strong><small>${d.sub}</small></div><select aria-label="${d.name} device type">${types.map((x,n)=>`<option ${n===i%4?'selected':''}>${x}</option>`).join('')}</select><button class="text-btn rename">Rename</button><button class="text-btn disable">${d.name.includes('Realtek')?'Enable':'Disable'}</button></article>`).join('')}</section>`;
const flash=m=>{const t=$('.toast');t.textContent=m;t.classList.add('show');clearTimeout(window.d);window.d=setTimeout(()=>t.classList.remove('show'),1400)};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.page').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.page).classList.add('active')});
document.addEventListener('input',e=>{if(e.target.type==='range')e.target.closest('.device-row').querySelector('.percent').textContent=e.target.value+'%'});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.classList.contains('switch')){b.classList.toggle('on');b.setAttribute('aria-checked',b.classList.contains('on'))}if(b.classList.contains('mute')){b.classList.toggle('on');b.textContent=b.classList.contains('on')?'Muted':'Mute'}if(b.classList.contains('rename')){const n=b.closest('.device-row').querySelector('strong'),v=prompt('Rename this Windows device',n.textContent);if(v){n.textContent=v;flash('Device renamed in Windows')}}if(b.classList.contains('disable')){b.textContent=b.textContent==='Enable'?'Disable':'Enable';flash('Device setting updated')}if(b.classList.contains('remove'))flash('Device removed from this ranking');if(b.classList.contains('move')){const r=b.closest('.device-row'),s=+b.dataset.dir<0?r.previousElementSibling:r.nextElementSibling;if(s)+b.dataset.dir<0?r.parentNode.insertBefore(r,s):r.parentNode.insertBefore(s,r)}})
</script>
</body>
</html>
