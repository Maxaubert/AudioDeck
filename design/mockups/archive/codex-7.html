<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AudioDeck - Codex 7</title>
  <style>
    :root{--black:#151515;--paper:#f4f0df;--yellow:#f6e94a;--coral:#f45b46;--aqua:#47cbbb;--pink:#f08bb4;--grey:#b9b6aa}
    *{box-sizing:border-box}body{margin:0;background:var(--coral);color:var(--black);font:18px/1.45 Arial,Helvetica,sans-serif;min-width:780px}button,select,input{font:inherit;color:inherit}button,select{cursor:pointer}
    :focus-visible{outline:5px solid white;outline-offset:3px}
    body:before,body:after{content:"";position:fixed;background:var(--yellow);z-index:-1;transform:rotate(-5deg)}body:before{width:42vw;height:80px;left:-20px;top:11vh}body:after{width:56vw;height:52px;right:-20px;bottom:14vh;transform:rotate(4deg)}
    .shell{width:min(1220px,calc(100% - 54px));margin:28px auto;background:var(--paper);clip-path:polygon(0 0,99.4% .8%,100% 98.8%,1% 100%)}
    header{background:var(--black);color:var(--paper);min-height:168px;padding:24px 36px 0;display:grid;grid-template-columns:360px 1fr;gap:24px;clip-path:polygon(0 0,100% 0,99.5% 92%,0 100%)}
    .brand{display:flex;align-items:flex-start;gap:18px}.slash-logo{width:86px;height:92px;position:relative}.slash-logo i{position:absolute;display:block;width:23px;height:82px;top:2px;background:var(--yellow);transform:skew(-13deg)}.slash-logo i:nth-child(1){left:5px}.slash-logo i:nth-child(2){left:37px;background:var(--coral)}.slash-logo i:nth-child(3){left:69px;height:49px;top:34px;background:var(--aqua)}
    .wordmark{font:900 45px/.84 Impact,"Arial Black",sans-serif;letter-spacing:1px;text-transform:uppercase}.wordmark small{display:block;font:800 12px/1.3 Arial,sans-serif;letter-spacing:2px;margin-top:12px;color:var(--yellow)}
    .headside{display:flex;flex-direction:column;justify-content:space-between}.manifesto{font-weight:800;max-width:470px;border-left:12px solid var(--aqua);padding:4px 0 4px 14px}
    nav{display:flex;align-items:flex-end;gap:10px}.tab{border:0;background:var(--paper);color:var(--black);padding:14px 24px 17px;font-weight:900;text-transform:uppercase;clip-path:polygon(3% 7%,100% 0,96% 100%,0 91%)}.tab:nth-child(2){background:var(--aqua);transform:rotate(1deg)}.tab:nth-child(3){background:var(--pink);transform:rotate(-1deg)}.tab:hover{background:var(--yellow);transform:translateY(-5px) rotate(-1deg)}.tab.active{background:var(--coral);color:var(--black);text-decoration:underline 5px var(--yellow);text-underline-offset:7px}
    main{padding:44px 42px 18px}.page{display:none}.page.active{display:block}.intro{display:grid;grid-template-columns:210px 1fr;gap:30px;align-items:start;margin-bottom:38px}.issue{display:inline-block;background:var(--black);color:var(--yellow);padding:13px 16px;font:900 14px/1 Arial,sans-serif;letter-spacing:2px;transform:rotate(-3deg);clip-path:polygon(0 5%,100% 0,95% 100%,3% 93%)}.intro h1{margin:0 0 18px;font:900 clamp(43px,6vw,76px)/.85 Impact,"Arial Black",sans-serif;text-transform:uppercase;letter-spacing:.5px}.intro p{margin:0;max-width:800px;font-size:20px;font-weight:750}
    .section{margin-bottom:42px}.section-head{display:flex;align-items:center;gap:18px;margin-bottom:12px}.section-head h2{margin:0;background:var(--yellow);padding:10px 22px;font:900 22px/1 Impact,"Arial Black",sans-serif;letter-spacing:2px;transform:rotate(-1deg);clip-path:polygon(2% 0,100% 6%,97% 100%,0 91%)}.section-head:after{content:"";height:7px;background:var(--black);flex:1}.section-head span{font:900 12px/1 Arial,sans-serif;text-transform:uppercase}
    .device-row{display:grid;grid-template-columns:68px 52px minmax(270px,1fr) auto;align-items:center;min-height:94px;background:#fff;border-bottom:2px solid var(--black);margin:0 0 7px;clip-path:polygon(0 2%,99.7% 0,100% 96%,.5% 100%);transition:transform .12s,background .12s}.device-row:nth-child(even){clip-path:polygon(.4% 0,100% 3%,99.4% 100%,0 96%)}.device-row:hover{transform:translateX(8px);background:var(--yellow)}.device-row.in-use{background:var(--aqua)}.device-row.override{background:var(--pink)}.device-row.offline{background:#d4d1c6;color:#77756f}
    .rank{font:900 36px/1 Impact,"Arial Black",sans-serif;text-align:center}.glyph{display:grid;place-items:center}.glyph svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:square}.device-name{padding:12px 8px}.device-name strong{font-size:21px;line-height:1.1}.device-name small{display:block;margin-top:6px;font-size:14px;font-weight:750;opacity:.73}.badge{display:inline-block;margin-left:10px;background:var(--black);color:white;padding:4px 7px;font:900 10px/1 Arial,sans-serif;letter-spacing:1px;transform:rotate(1deg)}
    .row-actions{display:flex;gap:4px;padding-right:13px}.icon-btn,.text-btn{height:43px;min-width:43px;border:2px solid var(--black);background:transparent;font-weight:900}.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.5}.icon-btn:hover,.text-btn:hover{background:var(--black);color:white;transform:rotate(-3deg)}
    .add-device{height:68px;width:calc(100% - 14px);margin:10px 7px 0;border:3px dashed var(--black);background:transparent;font-weight:900;text-transform:uppercase;letter-spacing:1px}.add-device:hover{background:var(--yellow);transform:rotate(.4deg)}
    .legend{display:flex;gap:22px;background:var(--black);color:white;padding:15px 20px;margin-bottom:12px;width:max-content;max-width:100%;font-weight:800;clip-path:polygon(0 7%,99% 0,100% 90%,1% 100%)}.legend span{display:flex;align-items:center;gap:9px}.swatch{width:22px;height:22px;background:var(--aqua)}.swatch.manual{background:var(--pink)}
    .mixer-row{grid-template-columns:68px 52px minmax(250px,1fr) minmax(240px,1fr) 70px 90px}.mix-control{padding:0 18px}.mix-control input{width:100%;accent-color:var(--black)}.percent{text-align:right;font:900 22px/1 Impact,sans-serif}.mute{height:43px;margin:0 12px;border:2px solid var(--black);background:transparent;font-weight:900}.mute:hover,.mute.on{background:var(--black);color:var(--yellow)}
    .device-manage{grid-template-columns:60px minmax(270px,1fr) 170px 98px 98px;padding:0 14px}.device-manage select{width:154px;background:var(--paper);border:2px solid var(--black);padding:8px}.disabled-device{background:#d4d1c6;color:#67655f}
    .note{background:var(--aqua);padding:19px 24px;font-weight:850;margin-bottom:20px;clip-path:polygon(0 4%,99% 0,100% 92%,1% 100%)}.remembered{display:flex;align-items:center;justify-content:space-between;background:var(--yellow);padding:17px 22px;margin-bottom:26px;font-weight:900;clip-path:polygon(1% 0,100% 5%,99% 100%,0 94%)}
    .switch{width:62px;height:34px;padding:4px;background:var(--grey);border:2px solid var(--black);position:relative}.switch:after{content:"";display:block;width:22px;height:22px;background:var(--black);transition:transform .15s}.switch.on{background:var(--aqua)}.switch.on:after{transform:translateX(28px)}
    .settings{display:grid;grid-template-columns:1fr 1fr 1.3fr;background:var(--yellow);padding:22px 36px 30px;gap:10px;clip-path:polygon(0 9%,100% 0,99.5% 100%,.5% 94%)}.setting{min-height:72px;background:var(--paper);padding:13px 17px;display:flex;align-items:center;justify-content:space-between;gap:14px;font-weight:900;clip-path:polygon(0 4%,99% 0,100% 96%,1% 100%)}.setting select{border:2px solid var(--black);background:white;padding:8px}
    .toast{position:fixed;right:25px;bottom:25px;background:var(--black);color:var(--yellow);padding:16px 22px;font-weight:900;transform:rotate(-2deg) translateY(130px);transition:.2s}.toast.show{transform:rotate(-2deg)}
    @media(max-width:930px){.shell{width:calc(100% - 20px);margin:10px}.intro{grid-template-columns:145px 1fr}.mixer-row{grid-template-columns:60px 45px 1fr 180px 58px 76px}.device-manage{grid-template-columns:48px 1fr 142px 82px 82px}.settings{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand"><span class="slash-logo" aria-hidden="true"><i></i><i></i><i></i></span><div class="wordmark">Audio<br>Deck<small>Make noise behave</small></div></div>
    <div class="headside"><div class="manifesto">A loud little control board for every place Windows sends your sound.</div><nav aria-label="Main pages"><button class="tab active" data-page="priority">Priority</button><button class="tab" data-page="mixer">Mixer</button><button class="tab" data-page="devices">Devices</button></nav></div>
  </header>
  <main><section id="priority" class="page active"></section><section id="mixer" class="page"></section><section id="devices" class="page"></section></main>
  <footer class="settings">
    <div class="setting"><span>Start with Windows</span><button class="switch on" role="switch" aria-checked="true" aria-label="Start with Windows"></button></div>
    <div class="setting"><span>Pause automation</span><button class="switch" role="switch" aria-checked="false" aria-label="Pause automation"></button></div>
    <label class="setting">Check devices every <select aria-label="Device check interval"><option selected>2 seconds</option><option>5 seconds</option><option>10 seconds</option></select></label>
  </footer>
</div>
<div class="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s), outputs=[{name:'AirPods Pro',sub:'Apple · Headphones',state:'offline',status:'OFFLINE'},{name:'Arctis Nova Pro',sub:'Steelseries · Headset',state:'in-use',status:'IN USE',vol:100},{name:'Quest',sub:'Meta · Headphones',vol:62},{name:'NVIDIA High Definition Audio',sub:'LG · TV',vol:45}], microphones=[{name:'Arctis Nova Pro Mic',sub:'Steelseries · Microphone',vol:100,mic:true},{name:'DJI MIC MINI',sub:'DJI · Wireless microphone',state:'override',status:'MANUAL OVERRIDE',vol:62,mic:true}];
const icon=t=>`<span class="glyph" aria-hidden="true"><svg viewBox="0 0 32 32">${t?'<rect x="11" y="3" width="10" height="18" rx="5"/><path d="M7 15v1a9 9 0 0 0 18 0v-1M16 25v4M11 29h10"/>':'<path d="M5 18v-4a11 11 0 0 1 22 0v4M5 17h5v10H7a2 2 0 0 1-2-2zM27 17h-5v10h3a2 2 0 0 0 2-2z"/>'}</svg></span>`;
const ctl=(p,l)=>`<button class="icon-btn ${l==='Remove'?'remove':'move'}" ${l!=='Remove'?`data-dir="${l==='Move up'?'-1':'1'}"`:''} aria-label="${l}"><svg viewBox="0 0 20 20"><path d="${p}"/></svg></button>`, actions=()=>`<div class="row-actions">${ctl('M4 12l6-6 6 6','Move up')}${ctl('M4 8l6 6 6-6','Move down')}${ctl('M5 5l10 10M15 5L5 15','Remove')}</div>`;
function pRow(d,i){return `<article class="device-row ${d.state||''}" draggable="${d.state!=='offline'}"><span class="rank">${i+1}</span>${icon(d.mic)}<div class="device-name"><strong>${d.name}${d.status?`<span class="badge">${d.status}</span>`:''}</strong><small>${d.sub}</small></div>${actions()}</article>`}
function mRow(d,i){return `<article class="device-row mixer-row ${d.state||''}"><span class="rank">${i+1}</span>${icon(d.mic)}<div class="device-name"><strong>${d.name}${d.status?`<span class="badge">${d.status}</span>`:''}</strong><small>${d.sub}</small></div>${d.state==='offline'?'<div class="mix-control"><b>Unavailable</b></div><span class="percent">--</span><button class="mute" disabled>Mute</button>':`<div class="mix-control"><input type="range" min="0" max="100" value="${d.vol}" aria-label="${d.name} volume"></div><span class="percent">${d.vol}%</span><button class="mute">Mute</button>`}</article>`}
function block(title,items,mode){return `<section class="section"><div class="section-head"><h2>${title}</h2><span>${items.length} ranked</span></div><div class="rows">${items.map((d,i)=>mode==='mix'?mRow(d,i):pRow(d,i)).join('')}</div>${mode==='priority'?'<button class="add-device">+ Add a device (2 more)</button>':''}</section>`}
$('#priority').innerHTML=`<div class="intro"><div><span class="issue">ISSUE 01 / ORDER</span></div><div><h1>Pick the next sound.</h1><p>The highest available device automatically becomes the Windows default. Click a row to switch to it now. Drag to reorder.</p></div></div>${block('OUTPUTS',outputs,'priority')}${block('MICROPHONES',microphones,'priority')}<div class="legend"><span><i class="swatch"></i> Automatic, in use</span><span><i class="swatch manual"></i> Manual override</span></div>`;
$('#mixer').innerHTML=`<div class="intro"><div><span class="issue">ISSUE 02 / LEVELS</span></div><div><h1>Turn some things down.</h1><p>Every ranked device keeps its own volume, ready for the next switch.</p></div></div>${block('OUTPUTS',outputs,'mix')}${block('MICROPHONES',microphones,'mix')}`;
const all=[...outputs,...microphones,{name:'Realtek Digital Output',sub:'Realtek · Disabled endpoint',state:'disabled-device'}],types=['Speakers','Headphones','Headset','TV'];
$('#devices').innerHTML=`<div class="intro"><div><span class="issue">ISSUE 03 / NAMES</span></div><div><h1>Know every jack.</h1><p>Find every endpoint that Windows remembers, even the disabled ones.</p></div></div><div class="note">Renames apply to Windows itself, so the new name appears in other audio menus too.</div><div class="remembered"><span>Show remembered devices (31)</span><button class="switch" role="switch" aria-checked="false" aria-label="Show remembered devices"></button></div><section class="section"><div class="section-head"><h2>ALL ENDPOINTS</h2><span>${all.length} found</span></div>${all.map((d,i)=>`<article class="device-row device-manage ${d.state||''}">${icon(d.mic)}<div class="device-name"><strong>${d.name}</strong><small>${d.sub}</small></div><select aria-label="${d.name} device type">${types.map((x,n)=>`<option ${n===i%4?'selected':''}>${x}</option>`).join('')}</select><button class="text-btn rename">Rename</button><button class="text-btn disable">${d.name.includes('Realtek')?'Enable':'Disable'}</button></article>`).join('')}</section>`;
const flash=m=>{const t=$('.toast');t.textContent=m;t.classList.add('show');clearTimeout(window.z);window.z=setTimeout(()=>t.classList.remove('show'),1400)};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.page').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.page).classList.add('active')});
document.addEventListener('input',e=>{if(e.target.type==='range')e.target.closest('.device-row').querySelector('.percent').textContent=e.target.value+'%'});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.classList.contains('switch')){b.classList.toggle('on');b.setAttribute('aria-checked',b.classList.contains('on'))}if(b.classList.contains('mute')){b.classList.toggle('on');b.textContent=b.classList.contains('on')?'Muted':'Mute'}if(b.classList.contains('rename')){const n=b.closest('.device-row').querySelector('strong'),v=prompt('Rename this Windows device',n.textContent);if(v){n.textContent=v;flash('Device renamed in Windows')}}if(b.classList.contains('disable')){b.textContent=b.textContent==='Enable'?'Disable':'Enable';flash('Device setting updated')}if(b.classList.contains('remove'))flash('Device removed from this ranking');if(b.classList.contains('move')){const r=b.closest('.device-row'),s=+b.dataset.dir<0?r.previousElementSibling:r.nextElementSibling;if(s)+b.dataset.dir<0?r.parentNode.insertBefore(r,s):r.parentNode.insertBefore(s,r)}})
</script>
</body>
</html>
