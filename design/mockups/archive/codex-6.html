<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AudioDeck - Codex 6</title>
  <style>
    :root{--mist:#dce9e7;--paper:#f8fbf9;--ink:#082d33;--teal:#007f78;--orange:#f0542d;--blue:#2672d5;--grey:#718080;--rail:#9fb9b5}
    *{box-sizing:border-box}body{margin:0;background:var(--mist);color:var(--ink);font:18px/1.45 "Segoe UI",Tahoma,sans-serif;min-width:780px}button,select,input{font:inherit;color:inherit}button,select{cursor:pointer}
    :focus-visible{outline:4px solid var(--orange);outline-offset:3px}
    .shell{width:min(1240px,calc(100% - 54px));margin:27px auto;background:var(--paper);border:1px solid var(--ink)}
    header{background:var(--ink);color:white;padding:0 30px;display:grid;grid-template-columns:270px 1fr;min-height:132px}
    .brand{display:flex;align-items:center;gap:17px}.roundel{width:68px;height:68px;border:10px solid var(--orange);border-radius:50%;position:relative}.roundel:after{content:"";position:absolute;left:-17px;right:-17px;top:17px;height:14px;background:var(--paper)}.roundel:before{content:"AD";position:absolute;z-index:1;left:4px;top:10px;color:var(--ink);font:900 15px/14px Arial,sans-serif}
    .wordmark{font:900 27px/1 Arial,sans-serif;letter-spacing:.2px}.wordmark small{display:block;font:700 11px/1.3 "Segoe UI",sans-serif;letter-spacing:2px;text-transform:uppercase;color:#acd2cd;margin-top:7px}
    .route-head{display:flex;flex-direction:column;justify-content:space-between;padding-top:25px}.route-status{display:flex;align-items:center;gap:14px;font-weight:700}.route-status i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--teal);border:2px solid white}.route-status span{color:#b9d7d4}
    nav{display:flex;gap:0;align-items:end}.tab{position:relative;border:0;background:transparent;color:white;font-weight:800;padding:18px 28px 22px;min-width:145px}.tab:before{content:"";position:absolute;top:-3px;left:calc(50% - 8px);width:16px;height:16px;background:var(--ink);border:4px solid #80aaa4;border-radius:50%}.tab:after{content:"";position:absolute;top:4px;left:0;right:0;height:3px;background:#80aaa4;z-index:0}.tab:first-child:after{left:50%}.tab:last-child:after{right:50%}.tab:hover{background:#124049}.tab.active{background:var(--paper);color:var(--ink)}.tab.active:before{background:var(--orange);border-color:white}
    main{padding:40px 46px 12px}.page{display:none}.page.active{display:block}.intro{display:grid;grid-template-columns:200px 1fr;gap:30px;margin-bottom:36px}.route-label{border-top:8px solid var(--orange);padding-top:12px;font:900 14px/1 Arial,sans-serif;letter-spacing:2px;text-transform:uppercase}.intro h1{margin:0 0 12px;font:900 clamp(38px,5vw,66px)/.95 "Arial Narrow","Segoe UI",sans-serif;letter-spacing:-2.5px}.intro p{margin:0;max-width:790px;font-size:20px}
    .section{margin-bottom:36px}.section-head{display:grid;grid-template-columns:85px 1fr auto;align-items:center;border-bottom:2px solid var(--ink);height:58px}.section-head:before{content:"";width:20px;height:20px;margin-left:32px;border:5px solid var(--ink);border-radius:50%;background:var(--paper)}.section-head h2{margin:0;font:900 17px/1 Arial,sans-serif;letter-spacing:2.5px}.section-head span{font-size:13px;font-weight:700;color:var(--grey);text-transform:uppercase}
    .rows{position:relative}.rows:before{content:"";position:absolute;left:41px;top:0;bottom:0;width:5px;background:var(--rail)}
    .device-row{position:relative;display:grid;grid-template-columns:85px 52px minmax(280px,1fr) auto;align-items:center;min-height:96px;border-bottom:1px solid #a9bfbc;transition:background .15s;padding-right:10px}.device-row:hover{background:#eaf3f1}.device-row.in-use{background:var(--teal);color:white}.device-row.override{background:var(--orange);color:#171d1d}.device-row.offline{background:#e2e6e4;color:#75817f}
    .rank{z-index:1;justify-self:center;width:43px;height:43px;border:5px solid var(--ink);border-radius:50%;background:var(--paper);display:grid;place-items:center;font:900 17px/1 Arial,sans-serif;color:var(--ink)}.in-use .rank,.override .rank{border-color:white}.glyph{display:grid;place-items:center}.glyph svg{width:29px;height:29px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}.device-name{padding:12px}.device-name strong{display:block;font-size:21px;line-height:1.12}.device-name small{display:block;margin-top:6px;font-size:14px;font-weight:650;opacity:.78}.badge{display:inline-block;margin-left:9px;border-bottom:3px solid currentColor;padding:2px 3px;font:900 11px/1 Arial,sans-serif;letter-spacing:1px}
    .row-actions{display:flex;gap:5px}.icon-btn,.text-btn{border:1px solid currentColor;background:transparent;height:42px;min-width:42px;font-weight:800}.icon-btn:hover,.text-btn:hover{background:var(--ink);color:white}.in-use .icon-btn:hover{background:white;color:var(--teal)}.override .icon-btn:hover{background:var(--ink);color:white}
    .icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.5}.add-device{margin:18px 0 0 85px;width:calc(100% - 85px);height:64px;border:2px dashed var(--teal);background:transparent;text-align:left;padding:0 20px;font-weight:800;color:var(--teal)}.add-device:hover{background:var(--teal);color:white}
    .legend{display:flex;gap:28px;margin:18px 0 10px;padding-left:85px;font-weight:750}.legend span{display:flex;align-items:center;gap:10px}.swatch{width:28px;height:7px;background:var(--teal)}.swatch.manual{background:var(--orange)}
    .mixer-row{grid-template-columns:85px 52px minmax(250px,1fr) minmax(260px,1.1fr) 70px 86px}.mix-control{display:flex;align-items:center;padding:0 16px}.mix-control input{width:100%;accent-color:var(--teal)}.override input{accent-color:var(--ink)}.percent{text-align:right;font-weight:900}.mute{height:42px;margin-left:10px;background:transparent;border:1px solid currentColor;font-weight:800}.mute:hover,.mute.on{background:var(--orange);color:var(--ink)}
    .device-manage{grid-template-columns:74px minmax(280px,1fr) 164px 96px 96px;padding-left:11px}.device-manage select{width:150px;background:white;color:var(--ink);border:1px solid var(--ink);padding:9px}.disabled-device{background:#e2e6e4;color:#677573}
    .note{padding:17px 20px;border-left:9px solid var(--orange);background:#e8f1ef;margin-bottom:20px;font-weight:700}.remembered{display:flex;align-items:center;justify-content:space-between;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:15px 18px;margin-bottom:26px;font-weight:800}
    .switch{width:64px;height:34px;border:0;border-radius:20px;background:#aab8b6;padding:4px;position:relative}.switch:after{content:"";display:block;width:26px;height:26px;background:white;border-radius:50%;transition:transform .16s}.switch.on{background:var(--teal)}.switch.on:after{transform:translateX(30px)}
    .settings{display:grid;grid-template-columns:1fr 1fr 1.3fr;background:#c6dad7;border-top:1px solid var(--ink)}.setting{min-height:80px;padding:15px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-right:1px solid #8aa5a1;font-weight:750}.setting:last-child{border:0}.setting select{background:var(--paper);border:1px solid var(--ink);padding:9px 12px}
    .toast{position:fixed;bottom:24px;right:24px;background:var(--orange);color:var(--ink);padding:14px 20px;border-left:8px solid var(--ink);font-weight:850;transform:translateY(100px);transition:.2s}.toast.show{transform:none}
    @media(max-width:930px){.shell{width:calc(100% - 18px);margin:9px}.intro{grid-template-columns:140px 1fr}.mixer-row{grid-template-columns:70px 45px 1fr 190px 60px 76px}.device-manage{grid-template-columns:58px 1fr 142px 82px 82px}.settings{grid-template-columns:1fr}.setting{border-right:0;border-bottom:1px solid #8aa5a1}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand"><span class="roundel" aria-hidden="true"></span><div class="wordmark">AudioDeck<small>Default route control</small></div></div>
    <div class="route-head"><div class="route-status"><i></i> Automation running <span>Next check in 2 seconds</span></div><nav aria-label="Main pages"><button class="tab active" data-page="priority">Priority</button><button class="tab" data-page="mixer">Mixer</button><button class="tab" data-page="devices">Devices</button></nav></div>
  </header>
  <main><section id="priority" class="page active"></section><section id="mixer" class="page"></section><section id="devices" class="page"></section></main>
  <footer class="settings">
    <div class="setting"><span>Start with Windows</span><button class="switch on" role="switch" aria-checked="true" aria-label="Start with Windows"></button></div>
    <div class="setting"><span>Pause automation</span><button class="switch" role="switch" aria-checked="false" aria-label="Pause automation"></button></div>
    <label class="setting">Check devices every <select aria-label="Device check interval"><option selected>2 seconds</option><option>5 seconds</option><option>10 seconds</option></select></label>
  </footer>
</div>
<div class="toast" role="status"></div>
<script>
const outputs=[{name:'AirPods Pro',sub:'Apple · Headphones',state:'offline',status:'OFFLINE'},{name:'Arctis Nova Pro',sub:'Steelseries · Headset',state:'in-use',status:'IN USE',vol:100},{name:'Quest',sub:'Meta · Headphones',vol:62},{name:'NVIDIA High Definition Audio',sub:'LG · TV',vol:45}];
const microphones=[{name:'Arctis Nova Pro Mic',sub:'Steelseries · Microphone',vol:100,mic:true},{name:'DJI MIC MINI',sub:'DJI · Wireless microphone',state:'override',status:'MANUAL OVERRIDE',vol:62,mic:true}];
const icon=t=>`<span class="glyph" aria-hidden="true"><svg viewBox="0 0 32 32">${t?'<rect x="11" y="3" width="10" height="18" rx="5"/><path d="M7 15v1a9 9 0 0 0 18 0v-1M16 25v4M11 29h10"/>':'<path d="M5 18v-4a11 11 0 0 1 22 0v4M5 17h5v10H7a2 2 0 0 1-2-2zM27 17h-5v10h3a2 2 0 0 0 2-2z"/>'}</svg></span>`;
const ctl=(path,label)=>`<button class="icon-btn ${label==='Remove'?'remove':'move'}" ${label!=='Remove'?`data-dir="${label==='Move up'?'-1':'1'}"`:''} aria-label="${label}" title="${label}"><svg viewBox="0 0 20 20"><path d="${path}"/></svg></button>`;
const actions=()=>`<div class="row-actions">${ctl('M4 12l6-6 6 6','Move up')}${ctl('M4 8l6 6 6-6','Move down')}${ctl('M5 5l10 10M15 5L5 15','Remove')}</div>`;
function priorityRow(d,i){return `<article class="device-row ${d.state||''}" draggable="${d.state!=='offline'}"><span class="rank">${i+1}</span>${icon(d.mic)}<div class="device-name"><strong>${d.name}${d.status?`<span class="badge">${d.status}</span>`:''}</strong><small>${d.sub}</small></div>${actions()}</article>`}
function mixerRow(d,i){return `<article class="device-row mixer-row ${d.state||''}"><span class="rank">${i+1}</span>${icon(d.mic)}<div class="device-name"><strong>${d.name}${d.status?`<span class="badge">${d.status}</span>`:''}</strong><small>${d.sub}</small></div>${d.state==='offline'?'<div class="mix-control"><strong>Unavailable</strong></div><span class="percent">--</span><button class="mute" disabled>Mute</button>':`<div class="mix-control"><input type="range" min="0" max="100" value="${d.vol}" aria-label="${d.name} volume"></div><span class="percent">${d.vol}%</span><button class="mute">Mute</button>`}</article>`}
function block(title,items,mode){return `<section class="section"><div class="section-head"><h2>${title}</h2><span>${items.length} stops</span></div><div class="rows">${items.map((d,i)=>mode==='mix'?mixerRow(d,i):priorityRow(d,i)).join('')}</div>${mode==='priority'?'<button class="add-device">+ Add a device (2 more)</button>':''}</section>`}
priority.innerHTML=`<div class="intro"><div class="route-label">Route 01<br>Default order</div><div><h1>Your sound has a route.</h1><p>The highest available device automatically becomes the Windows default. Click a row to switch to it now. Drag to reorder.</p></div></div>${block('OUTPUTS',outputs,'priority')}${block('MICROPHONES',microphones,'priority')}<div class="legend"><span><i class="swatch"></i> Automatic, in use</span><span><i class="swatch manual"></i> Manual override</span></div>`;
mixer.innerHTML=`<div class="intro"><div class="route-label">Route 02<br>Volume stops</div><div><h1>Set levels along the line.</h1><p>Each level follows its device, even when your default route changes.</p></div></div>${block('OUTPUTS',outputs,'mix')}${block('MICROPHONES',microphones,'mix')}`;
const all=[...outputs,...microphones,{name:'Realtek Digital Output',sub:'Realtek · Disabled endpoint',state:'disabled-device'}],types=['Speakers','Headphones','Headset','TV'];
devices.innerHTML=`<div class="intro"><div class="route-label">Route 03<br>All endpoints</div><div><h1>Map every connection.</h1><p>Review active, offline, and disabled Windows audio endpoints.</p></div></div><div class="note">Renames apply to Windows itself, so the new name appears in other audio menus too.</div><div class="remembered"><span>Show remembered devices (31)</span><button class="switch" role="switch" aria-checked="false" aria-label="Show remembered devices"></button></div><section class="section"><div class="section-head"><h2>ALL ENDPOINTS</h2><span>${all.length} stops</span></div><div class="rows">${all.map((d,i)=>`<article class="device-row device-manage ${d.state||''}">${icon(d.mic)}<div class="device-name"><strong>${d.name}</strong><small>${d.sub}</small></div><select aria-label="${d.name} device type">${types.map((x,n)=>`<option ${n===i%4?'selected':''}>${x}</option>`).join('')}</select><button class="text-btn rename">Rename</button><button class="text-btn disable">${d.name.includes('Realtek')?'Enable':'Disable'}</button></article>`).join('')}</div></section>`;
const flash=m=>{const t=document.querySelector('.toast');t.textContent=m;t.classList.add('show');clearTimeout(window.ft);window.ft=setTimeout(()=>t.classList.remove('show'),1400)};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.page').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.page).classList.add('active')});
document.addEventListener('input',e=>{if(e.target.type==='range')e.target.closest('.device-row').querySelector('.percent').textContent=e.target.value+'%'});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.classList.contains('switch')){b.classList.toggle('on');b.setAttribute('aria-checked',b.classList.contains('on'))}if(b.classList.contains('mute')){b.classList.toggle('on');b.textContent=b.classList.contains('on')?'Muted':'Mute'}if(b.classList.contains('rename')){const n=b.closest('.device-row').querySelector('strong'),v=prompt('Rename this Windows device',n.textContent);if(v){n.textContent=v;flash('Device renamed in Windows')}}if(b.classList.contains('disable')){b.textContent=b.textContent==='Enable'?'Disable':'Enable';flash('Device setting updated')}if(b.classList.contains('remove'))flash('Device removed from this ranking');if(b.classList.contains('move')){const r=b.closest('.device-row'),s=+b.dataset.dir<0?r.previousElementSibling:r.nextElementSibling;if(s)+b.dataset.dir<0?r.parentNode.insertBefore(r,s):r.parentNode.insertBefore(s,r)}})
</script>
</body>
</html>
