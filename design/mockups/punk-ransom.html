<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AudioDeck - punk-ransom</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wdth,wght@62..125,400..900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141210;
  --paper:#e8dfc8;
  --paper-2:#fffdf4;
  --teal:#16c9b2;
  --pink:#ff2f92;
  --yellow:#ffd400;
  --tomato:#f5482c;
  --dead:#cbc4b0;
  --dead-ink:#403c34;
  --sub:#544f45;
  --tape:rgba(255,214,102,.42);
  --line:#141210;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:#1b1a16;
  color:var(--ink);
  font-family:'Archivo',Arial,Helvetica,sans-serif;
  font-variation-settings:'wdth' 88;
  font-size:17px;
  line-height:1.35;
  min-width:960px;
  padding:22px 0 34px;
}
/* photocopy grain on the desktop backdrop */
body::before{
  content:"";position:fixed;inset:0;z-index:-2;
  background:
    repeating-linear-gradient(51deg,rgba(255,255,255,.035) 0 2px,transparent 2px 7px),
    radial-gradient(circle at 15% 8%,#2c2a23 0,#1b1a16 60%);
}
button,select,input{font:inherit;color:inherit;font-family:inherit}
button,select{cursor:pointer}
:focus-visible{outline:4px solid var(--pink);outline-offset:2px}
.tab:focus-visible{outline-color:var(--yellow)}

/* ---------- window ---------- */
.shell{
  width:min(1240px,calc(100% - 44px));
  margin:0 auto;
  background:var(--paper);
  border:3px solid #000;
  position:relative;
}
/* uncoated stock: faint halftone speckle */
main::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(20,18,16,.10) 1px,transparent 1.1px);
  background-size:7px 7px;
}
main > *{position:relative;z-index:1}
.edge{display:flex;height:9px}
.edge i{flex:1}
.edge i:nth-child(1){background:var(--tomato)}
.edge i:nth-child(2){background:var(--yellow)}
.edge i:nth-child(3){background:var(--teal)}
.edge i:nth-child(4){background:var(--pink)}

/* ---------- compact app header ---------- */
header{
  background:var(--ink);color:var(--paper);
  display:flex;align-items:center;gap:26px;
  padding:9px 16px 9px 14px;
  border-bottom:3px solid #000;
}
.brand{display:flex;align-items:center;gap:11px;flex:0 0 auto}
.eq{display:flex;align-items:flex-end;gap:3px;height:38px}
.eq i{display:block;width:8px;transform:skew(-11deg)}
.eq i:nth-child(1){height:38px;background:var(--yellow)}
.eq i:nth-child(2){height:24px;background:var(--tomato)}
.eq i:nth-child(3){height:32px;background:var(--teal)}
.wordmark{display:flex;align-items:center;gap:4px}
.wordmark .wm{
  display:inline-block;font-family:'Anton',Impact,sans-serif;
  font-size:25px;line-height:.9;letter-spacing:.5px;
  padding:2px 3px 3px;color:var(--ink);
}
.wm.a{background:var(--paper);transform:rotate(-2deg)}
.wm.u{background:var(--teal);transform:rotate(1.5deg);font-family:'Archivo';font-weight:900;font-variation-settings:'wdth' 62;font-size:27px}
.wm.d{background:var(--yellow);transform:rotate(-1deg)}
.wm.i{background:var(--paper-2);transform:rotate(2deg);font-family:'Space Mono';font-weight:700;font-size:21px}
.wm.o{background:var(--pink);transform:rotate(-2.5deg)}
.wordmark .deck{
  margin-left:5px;background:var(--paper);color:var(--ink);
  font-family:'Archivo';font-weight:900;font-variation-settings:'wdth' 62;
  font-size:26px;letter-spacing:1px;padding:4px 7px 5px;
  border-bottom:5px solid var(--yellow);transform:rotate(.6deg);
}
nav{display:flex;gap:8px;flex:1 1 auto}
.tab{
  border:0;background:transparent;padding:5px 6px 10px;
  position:relative;transition:transform .1s ease-out;
}
.tab:not(.active):hover{transform:translateY(-2px) rotate(-.6deg)}
.tab.active{background:var(--paper);box-shadow:5px 5px 0 var(--tomato)}
.tab.active::after{
  content:"";position:absolute;left:4px;right:4px;bottom:0;height:5px;background:var(--ink);
}
.status{
  display:flex;align-items:center;gap:9px;flex:0 0 auto;
  font-family:'Space Mono',monospace;font-size:13px;letter-spacing:.4px;color:var(--paper);
}
.status .live{
  display:flex;align-items:center;gap:7px;background:var(--teal);color:var(--ink);
  font-weight:700;padding:5px 9px;transform:rotate(-1deg);
}
.dot{width:9px;height:9px;background:var(--ink);animation:blip 1.6s steps(1,end) infinite}
@keyframes blip{0%,60%{opacity:1}61%,100%{opacity:.25}}
.status .scan{border:2px solid #6a655a;padding:4px 8px;color:#efe8d5}

/* ---------- ransom letters (labels + tabs only) ---------- */
.ransom{display:inline-flex;flex-wrap:wrap;align-items:center;line-height:1}
.rl{
  display:inline-block;line-height:.95;
  padding:.08em .15em .12em;
  margin:0 .035em;
  background:var(--bg,var(--paper-2));color:var(--fg,var(--ink));
  transform:rotate(var(--rot,0deg)) translateY(var(--dy,0));
  font-weight:900;
}
.rs{display:inline-block;width:.42em}
.r1{--bg:var(--yellow);font-family:'Anton',Impact,sans-serif;font-size:1.18em;font-weight:400;clip-path:polygon(0 5%,100% 0,97% 100%,3% 95%)}
.r2{--bg:var(--ink);--fg:var(--paper);font-variation-settings:'wdth' 66;font-size:1.08em}
.r3{--bg:var(--teal);font-variation-settings:'wdth' 112;font-weight:800;font-size:.88em;clip-path:polygon(2% 0,100% 4%,98% 96%,0 100%)}
.r4{--bg:var(--pink);font-family:'Anton',Impact,sans-serif;font-size:1.02em;font-weight:400}
.r5{--bg:var(--paper-2);font-variation-settings:'wdth' 62;font-size:1.16em;clip-path:polygon(0 0,100% 6%,96% 100%,4% 93%)}
.r6{--bg:var(--tomato);font-family:'Space Mono',monospace;font-weight:700;font-size:.82em;padding:.18em .18em}
.r7{--bg:transparent;box-shadow:inset 0 0 0 2px var(--ink);font-variation-settings:'wdth' 75;font-size:.96em}
.r8{--bg:var(--ink);--fg:var(--yellow);font-family:'Anton',Impact,sans-serif;font-size:.94em;font-weight:400;clip-path:polygon(3% 0,100% 5%,97% 100%,0 94%)}
.tab:not(.active) .rl{--bg:var(--paper);--fg:var(--ink);box-shadow:none}
.tab:not(.active):hover .rl{--bg:var(--yellow)}
.tab .ransom{font-size:19px}

/* ---------- tape ---------- */
.tape{
  position:absolute;height:24px;width:96px;background:var(--tape);
  border-top:1px solid rgba(0,0,0,.14);border-bottom:1px solid rgba(0,0,0,.14);
  clip-path:polygon(3% 0,100% 7%,97% 100%,0 93%);
  pointer-events:none;z-index:3;
}

/* ---------- main ---------- */
main{padding:16px 22px 20px;position:relative}
.page{display:none}
.page.active{display:block}
.section{margin-bottom:26px}
.section:last-child{margin-bottom:0}
.section-head{
  display:flex;align-items:center;gap:14px;
  margin:0 0 10px;padding-bottom:7px;
  border-bottom:6px solid var(--ink);position:relative;
}
.section-head h2{margin:0;font-size:30px}
.section-head .count{
  font-family:'Space Mono',monospace;font-weight:700;font-size:13px;letter-spacing:1px;
  text-transform:uppercase;background:var(--ink);color:var(--paper);padding:4px 8px;transform:rotate(-1deg);
}
.section-head .spacer{flex:1}
.legend{display:flex;gap:14px;align-items:center;font-size:13px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:15px;height:15px;background:var(--teal);border:2px solid var(--ink)}
.legend i.man{background:var(--pink)}

/* ---------- rows ---------- */
.row{
  display:grid;align-items:center;
  grid-template-columns:54px 44px minmax(240px,1fr) auto;
  min-height:72px;background:var(--paper-2);
  border:2px solid var(--ink);border-top-width:0;
  transition:transform .1s ease-out,background .1s ease-out;
}
.rows .row:first-child{border-top-width:2px}
.row:hover{background:var(--yellow);transform:translateX(5px)}
.row.in-use{background:var(--teal)}
.row.in-use:hover{background:#3fe0ca}
.row.override{background:var(--pink)}
.row.override:hover{background:#ff5ba9}
.row.off{background:var(--dead);color:var(--dead-ink)}
.row.off:hover{background:var(--dead);transform:none}
/* the nudge is a priority-list affordance only: it must not move a slider or a dropdown under the pointer */
.row.mix:hover,.row.dev:hover{transform:none}
.rank{
  font-family:'Anton',Impact,sans-serif;font-size:31px;text-align:center;
  align-self:stretch;display:grid;place-items:center;
  background:var(--ink);color:var(--paper);
}
.row.off .rank{background:#6f695c;color:#fff}
.glyph{display:grid;place-items:center}
.glyph svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:square;stroke-linejoin:miter}
.name{padding:11px 12px;min-width:0}
.name b{display:block;font-size:20px;font-weight:800;line-height:1.15;letter-spacing:.1px}
.name small{display:block;margin-top:3px;font-size:14.5px;font-weight:600;color:var(--sub);letter-spacing:.3px}
.row.off .name small,.row.in-use .name small,.row.override .name small{color:inherit}
.flag{
  display:inline-block;margin-left:9px;vertical-align:2px;
  font-family:'Space Mono',monospace;font-weight:700;font-size:11px;letter-spacing:1px;
  background:var(--ink);color:var(--paper);padding:3px 6px;transform:rotate(-1.5deg);
}
.flag.off{background:#8b8474;color:#fff}
.acts{display:flex;gap:5px;padding:0 12px}
.ibtn,.tbtn{
  height:42px;min-width:42px;border:2px solid var(--ink);background:transparent;
  font-weight:900;font-size:14px;letter-spacing:.8px;text-transform:uppercase;
  display:inline-grid;place-items:center;transition:transform .1s ease-out;
}
.tbtn{padding:0 12px}
.ibtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:square}
.ibtn:hover,.tbtn:hover{background:var(--ink);color:var(--paper-2)}
.ibtn:active,.tbtn:active{transform:translateY(2px)}
.ibtn[disabled],.tbtn[disabled]{opacity:.45;cursor:not-allowed}
.ibtn[disabled]:hover,.tbtn[disabled]:hover{background:transparent;color:inherit}

.add{
  position:relative;display:block;width:100%;height:52px;margin-top:9px;
  border:3px dashed var(--ink);background:transparent;
  font-weight:900;font-size:15px;letter-spacing:1.4px;text-transform:uppercase;
}
.add:hover{background:var(--yellow)}
.add:active{transform:translateY(2px)}

/* ---------- mixer ---------- */
.row.mix{grid-template-columns:54px 44px minmax(230px,340px) 1fr 72px 100px}
.slot{padding:0 18px 0 6px}
.slot b{font-family:'Space Mono',monospace;font-size:13px;letter-spacing:1px;text-transform:uppercase}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;cursor:grab;
}
input[type=range]::-webkit-slider-runnable-track{
  height:12px;border:2px solid var(--ink);
  background:linear-gradient(90deg,var(--ink) var(--fill,60%),#fff var(--fill,60%));
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:30px;margin-top:-11px;
  background:var(--tomato);border:2px solid var(--ink);
}
input[type=range]::-moz-range-track{height:12px;border:2px solid var(--ink);background:#fff}
input[type=range]::-moz-range-progress{height:12px;background:var(--ink)}
input[type=range]::-moz-range-thumb{width:16px;height:28px;border:2px solid var(--ink);background:var(--tomato);border-radius:0}
input[type=range]:active{cursor:grabbing}
.pct{font-family:'Space Mono',monospace;font-weight:700;font-size:19px;text-align:right}
.mute{margin:0 12px}
.mute.on{background:var(--ink);color:var(--yellow)}

/* ---------- devices ---------- */
.row.dev{grid-template-columns:46px minmax(230px,1fr) 176px 104px 108px;min-height:70px;padding-left:12px}
.row.dev select{
  width:100%;height:42px;border:2px solid var(--ink);background:var(--paper);padding:0 8px;
  font-weight:700;font-size:15px;
}
.row.dev select:hover{background:var(--yellow)}
.row.dis{background:var(--dead);color:var(--dead-ink)}
.row.dis:hover{background:var(--dead);transform:none}
.row.dev .tbtn{margin-right:10px;width:calc(100% - 10px)}
.remembered{
  position:relative;display:flex;align-items:center;gap:14px;
  border:2px solid var(--ink);background:var(--paper-2);padding:11px 14px;margin-bottom:16px;width:max-content;
}
.remembered .lab{font-weight:800;font-size:16px}
.remembered .num{font-family:'Space Mono',monospace;font-weight:700;background:var(--ink);color:var(--yellow);padding:3px 7px;font-size:13px}
.mini{
  font-size:13px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--sub);
}

/* ---------- switch ---------- */
.switch{
  width:60px;height:32px;padding:0;border:2px solid var(--ink);background:var(--dead);
  position:relative;display:block;flex:0 0 auto;
}
.switch::after{
  content:"";position:absolute;left:2px;top:2px;width:24px;height:24px;background:var(--ink);
  transition:transform .12s ease-out;
}
.switch.on{background:var(--yellow)}
.switch.on::after{transform:translateX(28px)}
.switch:hover{box-shadow:3px 3px 0 var(--tomato)}

/* ---------- bottom settings strip ---------- */
.settings{
  position:relative;display:flex;align-items:center;gap:26px;flex-wrap:wrap;
  background:var(--ink);color:var(--paper);border-top:3px solid #000;padding:12px 20px;
}
.set{display:flex;align-items:center;gap:11px;font-weight:800;font-size:15.5px;letter-spacing:.3px}
.set .switch{border-color:var(--paper)}
.set select{
  height:36px;border:2px solid var(--paper);background:var(--ink);color:var(--paper);padding:0 8px;
  font-family:'Space Mono',monospace;font-weight:700;font-size:14px;
}
.set select:hover{background:var(--tomato);border-color:var(--tomato);color:#fff}
.settings .grow{flex:1}
.build{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:1px;color:#a9a294}

/* ---------- toast ---------- */
.toast{
  position:fixed;right:26px;bottom:26px;z-index:9;
  background:var(--ink);color:var(--yellow);padding:14px 18px;
  font-weight:900;font-size:15px;letter-spacing:.6px;text-transform:uppercase;
  border:3px solid var(--yellow);
  transform:translateY(160px) rotate(-1.5deg);transition:transform .18s cubic-bezier(.23,1,.32,1);
}
.toast.show{transform:translateY(0) rotate(-1.5deg)}

@media(max-width:1080px){
  .row.mix{grid-template-columns:50px 40px minmax(170px,1fr) minmax(150px,1fr) 62px 88px}
  .row.dev{grid-template-columns:42px minmax(180px,1fr) 150px 92px 96px}
  .status .scan{display:none}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  .row:hover,.tab:not(.active):hover,.ibtn:active,.tbtn:active,.add:active{transform:none!important}
}
</style>
</head>
<body>

<div class="shell">
  <div class="edge" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

  <header>
    <div class="brand">
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="wordmark" role="img" aria-label="AudioDeck">
        <span aria-hidden="true" class="wm a">A</span><span aria-hidden="true" class="wm u">U</span><span aria-hidden="true" class="wm d">D</span><span aria-hidden="true" class="wm i">I</span><span aria-hidden="true" class="wm o">O</span>
        <span aria-hidden="true" class="deck">DECK</span>
      </span>
    </div>
    <nav aria-label="Pages">
      <button class="tab active" data-page="priority" aria-label="Priority"></button>
      <button class="tab" data-page="mixer" aria-label="Mixer"></button>
      <button class="tab" data-page="devices" aria-label="Devices"></button>
    </nav>
    <div class="status">
      <span class="live"><i class="dot" aria-hidden="true"></i>AUTOMATION ON</span>
      <span class="scan">SCAN 2s</span>
    </div>
  </header>

  <main>
    <span class="tape" style="top:-11px;right:38px;transform:rotate(3deg)" aria-hidden="true"></span>
    <span class="tape" style="top:-9px;left:24px;width:74px;transform:rotate(-4deg)" aria-hidden="true"></span>
    <section id="priority" class="page active"></section>
    <section id="mixer" class="page"></section>
    <section id="devices" class="page"></section>
  </main>

  <footer class="settings">
    <span class="tape" style="top:-12px;left:44px;transform:rotate(-2.5deg)" aria-hidden="true"></span>
    <div class="set"><span>Start with Windows</span><button class="switch on" role="switch" aria-checked="true" aria-label="Start with Windows"></button></div>
    <div class="set"><span>Pause automation</span><button class="switch" role="switch" aria-checked="false" aria-label="Pause automation"></button></div>
    <label class="set"><span>Check devices every</span>
      <select aria-label="Device check interval">
        <option selected>2 seconds</option><option>5 seconds</option><option>10 seconds</option><option>30 seconds</option>
      </select>
    </label>
    <span class="grow"></span>
    <span class="build">v0.9.4</span>
  </footer>
</div>

<div class="toast" role="status" aria-live="polite"></div>

<script>
const $=s=>document.querySelector(s);

/* ---- ransom-note generator: labels and tab names only ---- */
function ransom(text,seed){
  let h=(seed||7)*13+text.length;
  return [...text].map((ch,i)=>{
    if(ch===' ')return '<span class="rs"></span>';
    h=(h*31+ch.charCodeAt(0)*7+i*29)%9973;
    const cls='r'+((h%8)+1);
    const rot=((h>>3)%11)-5;
    const dy=((h>>6)%7)-3;
    return `<span class="rl ${cls}" style="--rot:${rot}deg;--dy:${dy}px">${ch}</span>`;
  }).join('');
}
const label=(t,seed)=>`<span class="ransom" aria-hidden="true">${ransom(t,seed)}</span>`;

/* ---- data ---- */
const outputs=[
  {name:'AirPods Pro',brand:'Apple',kind:'earbuds',type:'Headphones',state:'off',flag:'OFFLINE'},
  {name:'Arctis Nova Pro',brand:'Steelseries',kind:'headset',type:'Headset',state:'in-use',flag:'IN USE',vol:100},
  {name:'Quest',brand:'Meta',kind:'headphones',type:'Headphones',vol:62},
  {name:'NVIDIA High Definition Audio',brand:'LG',kind:'tv',type:'TV',vol:45}
];
const mics=[
  {name:'Arctis Nova Pro Mic',brand:'Steelseries',kind:'mic',type:'Headset',vol:84},
  {name:'DJI MIC MINI',brand:'DJI',kind:'mic',type:'Headset',state:'override',flag:'MANUAL OVERRIDE',vol:62}
];

/* ---- glyphs ---- */
const GLYPH={
  headset:'<path d="M5 18v-4a11 11 0 0 1 22 0v4M5 17h5v10H7a2 2 0 0 1-2-2zM27 17h-5v10h3a2 2 0 0 0 2-2zM22 27v2h-6"/>',
  headphones:'<path d="M5 18v-4a11 11 0 0 1 22 0v4M5 17h5v10H7a2 2 0 0 1-2-2zM27 17h-5v10h3a2 2 0 0 0 2-2z"/>',
  earbuds:'<path d="M5 8h9v8H5zM18 8h9v8h-9zM8 16v8h4v-8M20 16v8h4v-8"/>',
  tv:'<path d="M3 6h26v16H3zM12 26h8M16 22v4"/>',
  mic:'<path d="M12 3h8v14h-8zM7 15v1a9 9 0 0 0 18 0v-1M16 25v4M11 29h10"/>',
  optical:'<path d="M16 4l4 6h-8zM4 16a12 12 0 0 0 24 0M9 22l-3 5M23 22l3 5M16 13v9"/>'
};
const glyph=k=>`<span class="glyph" aria-hidden="true"><svg viewBox="0 0 32 32">${GLYPH[k]||GLYPH.headphones}</svg></span>`;

/* ---- controls ---- */
const ico=(d,l,attr)=>`<button class="ibtn" ${attr||''} aria-label="${l}"><svg viewBox="0 0 20 20"><path d="${d}"/></svg></button>`;
const acts=d=>`<div class="acts">
  ${ico('M4 12l6-6 6 6','Move '+d.name+' up','data-move="-1"'+(d.state==='off'?' disabled':''))}
  ${ico('M4 8l6 6 6-6','Move '+d.name+' down','data-move="1"'+(d.state==='off'?' disabled':''))}
  ${ico('M5 5l10 10M15 5L5 15','Remove '+d.name,'data-remove="1"')}
</div>`;

const nameCell=d=>`<div class="name"><b>${d.name}${d.flag?`<span class="flag${d.state==='off'?' off':''}">${d.flag}</span>`:''}</b><small>${d.brand} &middot; ${d.type}</small></div>`;

const pRow=(d,i)=>`<article class="row ${d.state||''}">
  <span class="rank">${i+1}</span>${glyph(d.kind)}${nameCell(d)}${acts(d)}
</article>`;

const mRow=(d,i)=>`<article class="row mix ${d.state||''}">
  <span class="rank">${i+1}</span>${glyph(d.kind)}${nameCell(d)}
  ${d.state==='off'
    ? '<div class="slot"><b>No signal</b></div><span class="pct">--</span><button class="tbtn mute" disabled>Mute</button>'
    : `<div class="slot"><input type="range" min="0" max="100" value="${d.vol}" style="--fill:${d.vol}%" aria-label="${d.name} volume"></div>
       <span class="pct">${d.vol}%</span>
       <button class="tbtn mute">Mute</button>`}
</article>`;

function block(title,items,mode,seed,extra){
  return `<section class="section">
    <div class="section-head">
      <h2>${label(title,seed)}</h2>
      <span class="count">${items.length} ranked</span>
      <span class="spacer"></span>
      ${extra||''}
    </div>
    <div class="rows">${items.map((d,i)=>mode==='mix'?mRow(d,i):pRow(d,i)).join('')}</div>
    ${mode==='rank'?'<button class="add">+ Add a device (2 more)</button>':''}
  </section>`;
}

const legend=`<span class="legend"><span><i></i>Automatic</span><span><i class="man"></i>Manual override</span></span>`;

$('#priority').innerHTML=
  block('OUTPUTS',outputs,'rank',3,legend)+
  block('MICROPHONES',mics,'rank',11);

$('#mixer').innerHTML=
  block('OUTPUTS',outputs,'mix',5)+
  block('MICROPHONES',mics,'mix',17);

/* ---- devices page ---- */
const all=[...outputs,...mics,{name:'Realtek Digital Output',brand:'Realtek',kind:'optical',type:'Speakers',state:'dis'}];
const TYPES=['Speakers','Headphones','Headset','TV'];
$('#devices').innerHTML=`
  <div class="remembered">
    <span class="tape" style="top:-13px;left:-16px;width:70px;transform:rotate(-6deg)" aria-hidden="true"></span>
    <span class="lab">Show remembered devices</span>
    <span class="num">31</span>
    <button class="switch" role="switch" aria-checked="false" aria-label="Show remembered devices"></button>
  </div>
  <section class="section">
    <div class="section-head">
      <h2>${label('ALL ENDPOINTS',23)}</h2>
      <span class="count">${all.length} found</span>
      <span class="spacer"></span>
      <span class="mini">Renames apply to Windows</span>
    </div>
    <div class="rows">${all.map(d=>`
      <article class="row dev ${d.state==='dis'?'dis':''}">
        ${glyph(d.kind)}
        <div class="name"><b>${d.name}</b><small>${d.brand} &middot; ${d.state==='dis'?'Disabled endpoint':d.type}</small></div>
        <select aria-label="${d.name} device type" ${d.state==='dis'?'disabled':''}>${TYPES.map(t=>`<option ${t===d.type?'selected':''}>${t}</option>`).join('')}</select>
        <button class="tbtn rename">Rename</button>
        <button class="tbtn toggle">${d.state==='dis'?'Enable':'Disable'}</button>
      </article>`).join('')}</div>
  </section>`;

/* ---- tabs ---- */
document.querySelectorAll('.tab').forEach((b,i)=>{
  b.innerHTML=label(b.getAttribute('aria-label').toUpperCase(),i*4+2);
  if(b.classList.contains('active'))b.setAttribute('aria-current','page');
  b.onclick=()=>{
    document.querySelectorAll('.tab').forEach(t=>{t.classList.remove('active');t.removeAttribute('aria-current')});
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    b.classList.add('active');b.setAttribute('aria-current','page');
    $('#'+b.dataset.page).classList.add('active');
  };
});

const jump=h=>{const b=document.querySelector('.tab[data-page="'+h+'"]');if(b)b.click();};
if(location.hash)jump(location.hash.slice(1));
addEventListener('hashchange',()=>jump(location.hash.slice(1)));

/* ---- toast ---- */
let tz;
const flash=m=>{const t=$('.toast');t.textContent=m;t.classList.add('show');clearTimeout(tz);tz=setTimeout(()=>t.classList.remove('show'),1600)};

/* ---- interactions ---- */
document.addEventListener('input',e=>{
  const r=e.target;
  if(r.type!=='range')return;
  r.style.setProperty('--fill',r.value+'%');
  r.closest('.row').querySelector('.pct').textContent=r.value+'%';
});

document.addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(!b)return;
  if(b.classList.contains('switch')){
    const on=b.classList.toggle('on');
    b.setAttribute('aria-checked',on);
    return;
  }
  if(b.classList.contains('mute')){
    const on=b.classList.toggle('on');
    b.textContent=on?'Muted':'Mute';
    return;
  }
  if(b.classList.contains('rename')){
    const n=b.closest('.row').querySelector('.name b');
    const v=prompt('Rename this Windows device',n.textContent.trim());
    if(v){n.textContent=v;flash('Renamed in Windows');}
    return;
  }
  if(b.classList.contains('toggle')){
    const row=b.closest('.row'),en=b.textContent==='Enable';
    b.textContent=en?'Disable':'Enable';
    row.classList.toggle('dis',!en);
    row.querySelector('select').disabled=!en;
    flash(en?'Endpoint enabled':'Endpoint disabled');
    return;
  }
  if(b.classList.contains('add')){flash('Pick a device to rank');return;}
  if(b.dataset.remove){flash('Removed from this ranking');return;}
  if(b.dataset.move){
    const row=b.closest('.row'),dir=+b.dataset.move;
    const sib=dir<0?row.previousElementSibling:row.nextElementSibling;
    if(!sib)return;
    dir<0?row.parentNode.insertBefore(row,sib):row.parentNode.insertBefore(sib,row);
    [...row.parentNode.children].forEach((r,i)=>{const k=r.querySelector('.rank');if(k)k.textContent=i+1;});
    flash('Order updated');
  }
});
</script>
</body>
</html>
