<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AudioDeck - Codex punk 5</title>
  <style>
    :root{
      --ink:#11110f;--paper:#f2edd9;--sheet:#fffdf3;--muted:#cac6b8;
      --auto:#39c9b8;--manual:#f06aa5;--acid:#f3e63e;--red:#ef553f;
      --display:Impact,"Arial Narrow",Haettenschweiler,"Arial Black",sans-serif;
      --body:Arial,Helvetica,sans-serif;--utility:"Arial Narrow",Arial,sans-serif;
    }
    *{box-sizing:border-box}
    html{background:#20201d}
    body{margin:0;min-width:1180px;background:var(--red);color:var(--ink);font:17px/1.25 var(--body)}
    button,select,input{font:inherit;color:inherit}
    button,select,input[type=range]{cursor:pointer}
    button:disabled,input:disabled{cursor:not-allowed}
    :focus-visible{outline:4px solid var(--red);outline-offset:3px}
    .shell{position:relative;width:1200px;min-height:780px;margin:20px auto;background:var(--paper);border:5px solid var(--ink);overflow:hidden}
    .shell:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.08;background-image:radial-gradient(var(--ink) .65px,transparent .8px);background-size:5px 5px;mix-blend-mode:multiply}
    .app-header{position:relative;z-index:2;height:92px;display:grid;grid-template-columns:280px 1fr 190px;align-items:stretch;background:var(--ink);color:var(--paper);border-bottom:5px solid var(--ink)}
    .brand{display:flex;align-items:center;gap:14px;padding:12px 22px}
    .mark{position:relative;width:56px;height:52px;flex:0 0 auto;transform:rotate(-3deg)}
    .mark i{position:absolute;top:2px;width:13px;height:47px;background:var(--acid);transform:skew(-14deg)}
    .mark i:nth-child(1){left:3px}.mark i:nth-child(2){left:21px;background:var(--red)}.mark i:nth-child(3){left:39px;height:30px;top:19px;background:var(--auto)}
    .wordmark{font:900 29px/.82 var(--display);letter-spacing:1px;text-transform:uppercase}
    .wordmark small{display:block;margin-top:7px;color:var(--acid);font:900 11px/1 var(--utility);letter-spacing:2.2px}
    .tabs{display:flex;align-items:end;justify-content:center;gap:7px;padding-top:24px}
    .tab{min-width:132px;height:52px;border:3px solid var(--ink);border-bottom:0;background:var(--paper);padding:0 18px;font:900 18px/1 var(--utility);letter-spacing:.6px;text-transform:uppercase;transform:rotate(-.5deg)}
    .tab:nth-child(2){background:var(--auto);transform:rotate(.7deg)}.tab:nth-child(3){background:var(--manual)}
    .tab:hover{background:var(--acid);transform:translateY(-4px) rotate(0)}
    .tab.active{height:58px;background:var(--red);color:var(--ink);box-shadow:inset 0 -8px 0 var(--acid)}
    .status{display:flex;align-items:center;justify-content:center;border-left:2px solid #4f4e47;color:var(--acid);font:900 13px/1 var(--utility);letter-spacing:1.4px;text-transform:uppercase}
    .status:before{content:"";width:10px;height:10px;margin-right:9px;background:var(--auto);border:2px solid var(--paper)}
    main{position:relative;z-index:1;padding:20px 26px 12px}
    .page{display:none}.page.active{display:block}
    .section{margin:0 0 20px}
    .section-head{height:38px;display:flex;align-items:center;margin:0 0 8px;border-bottom:6px solid var(--ink)}
    .section-head h2{align-self:stretch;min-width:225px;margin:0;background:var(--acid);padding:6px 16px 5px;font:900 22px/1 var(--display);letter-spacing:1.5px;text-transform:uppercase;transform:rotate(-.5deg);transform-origin:left bottom}
    .section-head span{margin-left:auto;padding:0 7px 4px;font:900 13px/1 var(--utility);letter-spacing:1px;text-transform:uppercase}
    .rows{display:grid;gap:5px}
    .device-row{position:relative;display:grid;grid-template-columns:58px 50px minmax(320px,1fr) auto;align-items:center;min-height:70px;background:var(--sheet);border:2px solid var(--ink);transition:transform .1s,background .1s}
    .device-row:nth-child(even){transform:rotate(.08deg)}.device-row:hover,.device-row:focus-within{z-index:2;background:var(--acid);transform:translateX(6px) rotate(0)}
    .device-row.in-use{background:var(--auto);border-left-width:12px}.device-row.override{background:var(--manual);border-left-width:12px}
    .device-row.offline,.device-row.disabled-device{background:var(--muted);color:#5e5b54;border-color:#5e5b54}
    .rank{font:900 30px/1 var(--display);text-align:center}
    .glyph{display:grid;place-items:center}
    .glyph svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:square;stroke-linejoin:miter}
    .device-name{min-width:0;padding:8px 10px}
    .device-name strong{font-size:19px;line-height:1.05}
    .device-name small{display:block;margin-top:5px;font:800 13px/1.05 var(--utility);letter-spacing:.3px;text-transform:uppercase}
    .badge{display:inline-block;margin-left:10px;padding:5px 7px;background:var(--ink);color:var(--paper);font:900 10px/1 var(--utility);letter-spacing:1.1px;vertical-align:2px;transform:rotate(1deg)}
    .offline .badge{background:#5e5b54}
    .row-actions{display:flex;gap:4px;padding-right:10px}
    .icon-btn,.text-btn,.mute{min-width:42px;height:40px;border:2px solid currentColor;background:transparent;font-weight:900}
    .icon-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.6}
    .icon-btn:hover,.text-btn:hover,.mute:hover{background:var(--ink);color:var(--paper);transform:rotate(-2deg)}
    .add-device{width:100%;height:50px;margin-top:7px;border:3px dashed var(--ink);background:transparent;font:900 15px/1 var(--utility);letter-spacing:1px;text-transform:uppercase}
    .add-device:hover{background:var(--acid);transform:rotate(.15deg)}
    .legend{display:flex;justify-content:flex-end;gap:17px;margin:-4px 0 9px;font:900 12px/1 var(--utility);letter-spacing:.6px;text-transform:uppercase}
    .legend span{display:flex;align-items:center;gap:7px}.swatch{width:15px;height:15px;background:var(--auto);border:2px solid var(--ink)}.swatch.manual{background:var(--manual)}
    .mixer-row{grid-template-columns:58px 50px minmax(280px,1fr) minmax(250px,1fr) 62px 78px}
    .mix-control{padding:0 16px}
    input[type=range]{width:100%;height:24px;accent-color:var(--ink)}
    .percent{text-align:right;font:900 20px/1 var(--display)}
    .mute{margin:0 9px}.mute.on{background:var(--ink);color:var(--acid)}
    .unavailable{font:900 13px/1 var(--utility);letter-spacing:1px;text-transform:uppercase}
    .device-manage{grid-template-columns:54px minmax(310px,1fr) 175px 92px 92px;padding:0 10px}
    .device-manage select,.setting select{height:40px;border:2px solid var(--ink);background:var(--paper);padding:5px 9px;font-weight:800}
    .remembered{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px;padding:10px 14px;background:var(--acid);border:3px solid var(--ink);font-weight:900}
    .switch{position:relative;width:58px;height:32px;padding:3px;border:2px solid var(--ink);background:var(--muted)}
    .switch:after{content:"";display:block;width:22px;height:22px;background:var(--ink);transition:transform .12s}
    .switch.on{background:var(--auto)}.switch.on:after{transform:translateX(26px)}
    .settings{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:3px;padding:10px 15px 14px;background:var(--ink);color:var(--paper)}
    .setting{min-height:54px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 14px;border:2px solid var(--paper);font:900 14px/1.1 var(--utility);letter-spacing:.3px}
    .setting select{background:var(--paper);color:var(--ink)}
    .toast{position:fixed;right:25px;bottom:25px;z-index:8;max-width:360px;padding:14px 20px;background:var(--ink);color:var(--acid);border:3px solid var(--paper);font-weight:900;transform:translateY(140px) rotate(-2deg);transition:.16s}
    .toast.show{transform:translateY(0) rotate(-2deg)}

    .p2{--paper:#eee8d2;--sheet:#fffef7;--auto:#32b9a8;--manual:#ff563f;--acid:#ffd62f;--red:#ef3f32}
    .p2 .shell{border-width:4px}.p2 .app-header{height:86px;background:var(--paper);color:var(--ink);border-bottom:10px solid var(--ink)}
    .p2 .status{border-left:2px solid var(--ink)}.p2 .status:before{border-color:var(--ink)}
    .p2 .tabs{padding-top:18px}.p2 .tab{height:47px;background:var(--ink);color:var(--paper);border-color:var(--ink)}
    .p2 .tab:nth-child(2){background:var(--auto);color:var(--ink)}.p2 .tab:nth-child(3){background:var(--manual);color:var(--ink)}.p2 .tab.active{height:53px;background:var(--acid);color:var(--ink);box-shadow:inset 0 -7px 0 var(--red)}
    .p2 main{padding-top:16px}.p2 .device-row{min-height:67px}.p2 .section{margin-bottom:16px}
    .p2 .section-head h2{background:var(--ink);color:var(--acid);transform:none}
    .p2 .in-use .badge,.p2 .override .badge{background:var(--paper);color:var(--ink)}

    .p3{--paper:#f5edc8;--sheet:#fffdf1;--auto:#17b6ad;--manual:#f04b3f;--acid:#ffef46;--red:#e94735}
    .p3 .app-header{grid-template-columns:320px 1fr 205px;background:var(--acid);color:var(--ink);border-bottom:12px solid var(--red)}
    .p3 .wordmark small{color:var(--red)}.p3 .status{border-color:var(--ink)}.p3 .status:before{border-color:var(--ink)}
    .p3 .tabs{align-items:center;padding-top:0}.p3 .tab{height:46px;border:0;border-right:3px solid var(--paper);background:var(--ink);color:var(--paper);transform:none}
    .p3 .tab:hover{background:var(--red);color:var(--ink);transform:translateY(-3px)}.p3 .tab.active{height:54px;background:var(--auto);color:var(--ink);box-shadow:8px 8px 0 var(--ink)}
    .p3 .section-head{border-bottom-color:var(--red)}.p3 .section-head h2{min-width:290px;background:var(--ink);color:var(--paper);transform:rotate(.4deg)}
    .p3 .device-row{border-left-width:7px}.p3 .device-row.in-use{border-left-width:20px}.p3 .device-row.override{border-left-width:20px}

    .p4{--paper:#eee9d8;--sheet:#fffdf3;--auto:#31cbb5;--manual:#ff5da2;--acid:#ffed39;--red:#f04d3a;background:#22aa9f}
    .p4 .shell{background-color:var(--paper);background-image:linear-gradient(90deg,transparent 49%,rgba(17,17,15,.08) 50%,transparent 51%),linear-gradient(transparent 49%,rgba(17,17,15,.08) 50%,transparent 51%);background-size:48px 48px}
    .p4 .app-header{height:88px;background:var(--paper);color:var(--ink);border-bottom:5px dashed var(--ink)}
    .p4 .wordmark small{color:var(--red)}.p4 .status{border-color:var(--ink)}.p4 .status:before{border-color:var(--ink)}
    .p4 .tab{height:44px;border:3px solid var(--ink);background:var(--sheet);box-shadow:5px 5px 0 var(--ink);transform:rotate(-2deg)}
    .p4 .tab:nth-child(2){background:var(--auto);transform:rotate(1.5deg)}.p4 .tab:nth-child(3){background:var(--manual);transform:rotate(-1deg)}
    .p4 .tab.active{height:49px;background:var(--acid);box-shadow:7px 7px 0 var(--red)}
    .p4 #priority.active,.p4 #mixer.active{display:grid;grid-template-columns:1.45fr 1fr;gap:18px;align-items:start}
    .p4 #priority .legend{grid-column:1/-1}.p4 .section{padding:10px;background:var(--sheet);border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);transform:rotate(-.35deg)}
    .p4 .section:nth-of-type(2){transform:rotate(.5deg);margin-top:12px}.p4 .section-head{border-bottom:0}
    .p4 .section-head h2{min-width:180px;background:var(--acid);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--red);transform:rotate(-2deg)}
    .p4 .device-row{grid-template-columns:48px 42px minmax(190px,1fr) auto;min-height:77px;margin:2px 0 6px;box-shadow:3px 3px 0 var(--ink);transform:rotate(-.3deg)}
    .p4 .device-row:nth-child(even){transform:rotate(.45deg)}.p4 .device-row:hover{transform:translateY(-3px) rotate(0)}
    .p4 .mixer-row{grid-template-columns:46px 40px minmax(160px,1fr) minmax(115px,1fr) 54px 70px}
    .p4 .device-name strong{font-size:17px}.p4 .row-actions{gap:2px;padding-right:5px}.p4 .icon-btn{min-width:35px}
    .p4 .settings{background:var(--red);color:var(--ink)}.p4 .setting{background:var(--acid);border-color:var(--ink)}

    .p5{--paper:#ebe7dc;--sheet:#f8f5ec;--auto:#d8d5cb;--manual:#ef3f32;--acid:#f4f1e8;--red:#ef3f32;background:#171715}
    .p5 .shell{border:9px solid var(--ink);filter:contrast(1.04)}
    .p5 .shell:before{content:"COPY 05";position:absolute;right:22px;top:104px;z-index:3;color:var(--red);font:900 13px/1 var(--utility);letter-spacing:3px;transform:rotate(90deg);transform-origin:right top}
    .p5 .shell:after{opacity:.17;background-image:repeating-radial-gradient(circle at 0 0,var(--ink) 0 1px,transparent 1px 4px);background-size:7px 7px}
    .p5 .app-header{height:82px;grid-template-columns:260px 1fr 210px;background:var(--sheet);color:var(--ink);border-bottom:9px double var(--ink)}
    .p5 .mark i{background:var(--ink)!important}.p5 .wordmark small{color:var(--red)}.p5 .status{border-color:var(--ink)}.p5 .status:before{background:var(--ink);border-color:var(--ink)}
    .p5 .tabs{padding-top:14px}.p5 .tab{height:43px;background:var(--sheet);border:2px solid var(--ink);transform:none}
    .p5 .tab:nth-child(2),.p5 .tab:nth-child(3){background:var(--sheet);transform:none}.p5 .tab:hover{background:var(--ink);color:var(--paper);transform:none}.p5 .tab.active{height:49px;background:var(--ink);color:var(--paper);box-shadow:inset 0 -6px 0 var(--red)}
    .p5 main{padding:16px 24px 8px}.p5 .section{display:grid;grid-template-columns:155px 1fr;margin-bottom:14px;border-top:4px solid var(--ink)}
    .p5 .section-head{height:auto;min-height:76px;display:block;border:0;padding:9px 8px 0 0}
    .p5 .section-head h2{min-width:0;background:transparent;padding:0;font-size:30px;line-height:.85;transform:none}.p5 .section-head span{display:block;margin:8px 0 0;padding:0;color:var(--red)}
    .p5 .rows{grid-column:2}.p5 .add-device{grid-column:2}.p5 .device-row{min-height:61px;background:transparent;border:0;border-bottom:2px solid var(--ink)}
    .p5 .device-row:hover{background:var(--sheet);transform:translateX(-5px)}.p5 .device-row.in-use{background:var(--ink);color:var(--paper);border-left:8px solid var(--ink)}
    .p5 .device-row.override{background:var(--red);color:var(--ink);border-left:8px solid var(--ink)}.p5 .badge{background:var(--sheet);color:var(--ink)}
    .p5 .mixer-row{grid-template-columns:52px 45px minmax(230px,1fr) minmax(210px,1fr) 60px 78px}
    .p5 .remembered{background:transparent;border:4px double var(--ink)}.p5 .settings{background:var(--ink)}.p5 .setting{border-style:dashed}

    .p6{--paper:#efdfad;--sheet:#f8edca;--auto:#25b7ad;--manual:#ef4c3d;--acid:#f3dc39;--red:#df3e31;background:#121210}
    .p6 .shell{background:var(--ink);border-color:var(--paper);padding:0 22px 18px}
    .p6 .shell:after{display:none}.p6 .app-header{height:88px;margin:0 -22px 14px;grid-template-columns:290px 1fr 190px;background:var(--ink);border-bottom:3px solid var(--paper)}
    .p6 .app-header:after{content:"A  /  AUDIO CONTROL  /  02 SEC";position:absolute;left:22px;right:22px;bottom:-13px;height:22px;padding:2px 12px;background:var(--red);color:var(--ink);font:900 12px/18px var(--utility);letter-spacing:2px}
    .p6 .tab{height:44px;background:var(--paper);border-color:var(--paper);transform:none}.p6 .tab:nth-child(2){background:var(--auto)}.p6 .tab:nth-child(3){background:var(--red)}.p6 .tab.active{height:49px;background:var(--acid);box-shadow:inset 0 -7px 0 var(--ink)}
    .p6 main{background:var(--paper);padding:27px 24px 10px;border-left:14px solid var(--red);clip-path:polygon(0 0,100% .5%,99.6% 100%,.4% 99.5%)}
    .p6 #priority.active,.p6 #mixer.active{display:grid;grid-template-columns:1.45fr 1fr;gap:17px;align-items:start}.p6 #priority .legend{grid-column:1/-1}
    .p6 .section{border:4px solid var(--ink);margin-bottom:15px}.p6 .section-head{height:42px;margin:0;background:var(--ink);color:var(--paper);border:0}
    .p6 .section-head h2{min-width:190px;background:var(--red);color:var(--ink);transform:none}.p6 .section-head span{padding-right:11px}
    .p6 .rows{gap:0}.p6 .device-row{grid-template-columns:50px 44px minmax(190px,1fr) auto;min-height:75px;background:var(--sheet);border:0;border-bottom:2px solid var(--ink)}
    .p6 .device-row:last-child{border-bottom:0}.p6 .device-row:hover{background:var(--acid);transform:none}.p6 .device-row.in-use{background:var(--auto);border-left:8px solid var(--ink)}.p6 .device-row.override{background:var(--red);border-left:8px solid var(--ink)}
    .p6 .mixer-row{grid-template-columns:44px 38px minmax(145px,1fr) minmax(110px,1fr) 53px 68px}.p6 .device-name strong{font-size:17px}
    .p6 .row-actions{gap:2px;padding-right:5px}.p6 .icon-btn{min-width:34px}.p6 .add-device{margin:0;border-width:2px 0 0;height:46px}
    .p6 .settings{margin:0;background:var(--paper);color:var(--ink);border-top:0}.p6 .setting{border-color:var(--ink)}

    .p7{--paper:#f2e4ba;--sheet:#f4e8c5;--auto:#1ebcb1;--manual:#ff4a32;--acid:#f5dc21;--red:#f14b35;background:#f1d71f}
    .p7 .shell{background:var(--red);border-width:8px}
    .p7 .shell:after{opacity:.13;background-image:repeating-linear-gradient(18deg,var(--ink) 0 1px,transparent 1px 8px)}
    .p7 .app-header{height:100px;grid-template-columns:330px 1fr 175px;background:var(--ink);border-bottom:9px solid var(--acid)}
    .p7 .wordmark{font-size:36px;transform:skew(-5deg)}.p7 .tabs{padding-top:25px;gap:0}.p7 .tab{height:48px;border:3px solid var(--paper);background:var(--ink);color:var(--paper);transform:none}
    .p7 .tab:nth-child(2),.p7 .tab:nth-child(3){background:var(--ink);color:var(--paper);transform:none}.p7 .tab:hover{background:var(--acid);color:var(--ink);transform:translateY(-5px)}
    .p7 .tab.active{height:57px;background:var(--red);color:var(--ink);box-shadow:inset 0 -9px 0 var(--acid)}
    .p7 main{padding:20px;background:var(--red)}.p7 #priority.active,.p7 #mixer.active{display:grid;grid-template-columns:1.35fr 1fr;gap:15px;align-items:start}.p7 #priority .legend{grid-column:1/-1}
    .p7 .section{padding:0 10px 10px;background:var(--paper);border:6px solid var(--ink);box-shadow:9px 9px 0 var(--acid);transform:skewY(-.25deg)}
    .p7 .section:nth-of-type(2){background:var(--acid);transform:skewY(.4deg)}.p7 .section-head{height:56px;border-bottom:8px solid var(--ink)}
    .p7 .section-head h2{min-width:0;padding:7px 10px 3px;background:transparent;font-size:34px;transform:none}.p7 .section-head span{font-size:14px}
    .p7 .device-row{grid-template-columns:48px 42px minmax(170px,1fr) auto;min-height:77px;background:transparent;border-width:0 0 4px;transform:none}
    .p7 .device-row:hover{background:var(--sheet);transform:translateX(3px)}.p7 .device-row.in-use{background:var(--auto);border-left:9px solid var(--ink)}.p7 .device-row.override{background:var(--red);border-left:9px solid var(--ink)}
    .p7 .mixer-row{grid-template-columns:44px 38px minmax(145px,1fr) minmax(105px,1fr) 52px 67px}.p7 .device-name strong{font-size:17px}
    .p7 .row-actions{gap:1px;padding-right:3px}.p7 .icon-btn{min-width:33px}.p7 .add-device{background:var(--red)}
    .p7 .legend{background:var(--ink);color:var(--paper);padding:9px 12px;margin:0}.p7 .settings{background:var(--acid);color:var(--ink)}.p7 .setting{border-color:var(--ink);background:var(--paper)}

    .p8{--paper:#ddd8c8;--sheet:#eeeade;--auto:#22b7aa;--manual:#f0523d;--acid:#f4dc2e;--red:#ef4d37;background:#3a3934}
    .p8 .shell{background:var(--sheet);border:2px solid var(--ink)}
    .p8 .shell:after{opacity:.08;background-image:repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 18px)}
    .p8 .app-header{height:78px;grid-template-columns:270px 1fr 220px;background:var(--acid);color:var(--ink);border-bottom:8px solid var(--ink)}
    .p8 .mark{height:44px}.p8 .mark i{height:40px;background:var(--ink)!important}.p8 .wordmark small{color:var(--red)}.p8 .status{border-color:var(--ink)}.p8 .status:before{background:var(--red);border-color:var(--ink)}
    .p8 .tabs{align-items:center;padding:0;gap:4px}.p8 .tab{height:39px;min-width:125px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);transform:none}
    .p8 .tab:nth-child(2),.p8 .tab:nth-child(3){background:var(--ink);color:var(--paper);transform:none}.p8 .tab:hover{background:var(--red);color:var(--ink);transform:none}.p8 .tab.active{height:47px;background:var(--paper);color:var(--ink);box-shadow:6px 6px 0 var(--red)}
    .p8 main{padding:15px 18px 8px}.p8 .section{display:grid;grid-template-columns:180px 1fr;margin-bottom:12px;border:2px solid var(--ink)}
    .p8 .section-head{height:auto;display:block;margin:0;padding:12px;background:var(--ink);color:var(--paper);border:0}
    .p8 .section-head h2{min-width:0;background:var(--acid);color:var(--ink);padding:8px 10px;font:900 20px/1 var(--utility);letter-spacing:2px;transform:none}
    .p8 .section-head span{display:block;margin:12px 0 0;padding:0;color:var(--acid)}
    .p8 .rows{grid-column:2;gap:0}.p8 .add-device{grid-column:2;margin:0;border-width:2px 0 0;height:44px}
    .p8 .device-row{min-height:60px;background:var(--sheet);border-width:0 0 1px 0;transform:none}.p8 .device-row:hover{background:var(--acid);transform:none}
    .p8 .device-row.in-use{background:var(--auto);border-left:14px solid var(--ink)}.p8 .device-row.override{background:var(--manual);border-left:14px solid var(--ink)}
    .p8 .mixer-row{grid-template-columns:52px 45px minmax(225px,1fr) minmax(195px,1fr) 60px 75px}
    .p8 .badge{transform:none}.p8 .remembered{background:var(--ink);color:var(--paper);border:0;border-left:18px solid var(--acid)}
    .p8 .settings{padding:6px;background:var(--ink)}.p8 .setting{min-height:48px;border:1px solid var(--paper)}.p8 .switch{height:28px}.p8 .switch:after{width:18px;height:18px}.p8 .switch.on:after{transform:translateX(28px)}

    .p9{--paper:#eee8d5;--sheet:#faf6e9;--auto:#2bc0b2;--manual:#ef4c3c;--acid:#f1da32;--red:#ed4a38;background:#d8d2c2}
    .p9 .shell{background:var(--paper);border:7px double var(--ink)}
    .p9 .shell:after{opacity:.1;background-image:repeating-radial-gradient(circle,var(--ink) 0 1px,transparent 1px 3px);background-size:6px 6px}
    .p9 .app-header{height:80px;grid-template-columns:270px 1fr 205px;background:var(--paper);color:var(--ink);border-bottom:12px solid var(--ink)}
    .p9 .mark i:nth-child(1){background:var(--ink)}.p9 .wordmark small{color:var(--red)}.p9 .status{border-color:var(--ink)}.p9 .status:before{border-color:var(--ink)}
    .p9 .tabs{padding-top:13px;gap:0}.p9 .tab{height:42px;border:2px solid var(--ink);background:var(--paper);transform:none}
    .p9 .tab:nth-child(2),.p9 .tab:nth-child(3){background:var(--paper);transform:none}.p9 .tab:hover{background:var(--acid);transform:none}.p9 .tab.active{height:48px;background:var(--ink);color:var(--paper);box-shadow:inset 0 -6px 0 var(--red)}
    .p9 main{padding:14px 18px 8px}.p9 #priority.active,.p9 #mixer.active{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;align-items:start}.p9 #priority .legend{grid-column:1/-1}
    .p9 .section{border-top:7px solid var(--ink);border-bottom:2px solid var(--ink);margin-bottom:12px}.p9 .section-head{height:44px;border-bottom:2px solid var(--ink)}
    .p9 .section-head h2{min-width:0;background:transparent;padding:3px 8px 0 0;font-size:31px;transform:none}.p9 .section-head span{color:var(--red)}
    .p9 .rows{gap:0}.p9 .device-row{grid-template-columns:48px 42px minmax(175px,1fr) auto;min-height:72px;background:transparent;border-width:0 0 1px;transform:none}
    .p9 .device-row:hover{background:var(--sheet);transform:none}.p9 .device-row.in-use{background:var(--auto);border-left:8px solid var(--ink)}.p9 .device-row.override{background:var(--manual);border-left:8px solid var(--ink)}
    .p9 .mixer-row{grid-template-columns:44px 38px minmax(145px,1fr) minmax(105px,1fr) 52px 67px}.p9 .device-name strong{font-size:17px}
    .p9 .row-actions{gap:1px;padding-right:3px}.p9 .icon-btn{min-width:33px}.p9 .add-device{height:43px;margin:0;border-width:1px 0 0}
    .p9 .legend{padding-top:4px;border-top:2px solid var(--ink)}.p9 .remembered{background:transparent;border-width:2px 0 5px}.p9 .settings{background:var(--paper);color:var(--ink);border-top:8px solid var(--ink)}.p9 .setting{border-color:var(--ink)}

    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body class="punk p5">
  <div class="shell">
    <header class="app-header">
      <div class="brand">
        <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <div class="wordmark">AudioDeck<small>Windows audio order</small></div>
      </div>
      <nav class="tabs" aria-label="App sections">
        <button class="tab active" data-page="priority" aria-selected="true">Priority</button>
        <button class="tab" data-page="mixer" aria-selected="false">Mixer</button>
        <button class="tab" data-page="devices" aria-selected="false">Devices</button>
      </nav>
      <div class="status">Automation on, 2s</div>
    </header>
    <main>
      <section id="priority" class="page active" aria-label="Priority"></section>
      <section id="mixer" class="page" aria-label="Mixer"></section>
      <section id="devices" class="page" aria-label="Devices"></section>
    </main>
    <footer class="settings">
      <div class="setting"><span>Start with Windows</span><button class="switch on" role="switch" aria-checked="true" aria-label="Start with Windows"></button></div>
      <div class="setting"><span>Pause automation</span><button class="switch" role="switch" aria-checked="false" aria-label="Pause automation"></button></div>
      <label class="setting">Check devices every
        <select aria-label="Device check interval"><option selected>2 seconds</option><option>5 seconds</option><option>10 seconds</option></select>
      </label>
    </footer>
  </div>
  <div class="toast" role="status" aria-live="polite"></div>
  <script>
    const outputs=[
      {name:"AirPods Pro",sub:"Apple · Headphones",state:"offline",status:"OFFLINE",kind:"headphones"},
      {name:"Arctis Nova Pro",sub:"Steelseries · Headset",state:"in-use",status:"IN USE",vol:100,kind:"headphones"},
      {name:"Quest",sub:"Meta · Headphones",vol:62,kind:"headphones"},
      {name:"NVIDIA High Definition Audio",sub:"LG · TV",vol:45,kind:"screen"}
    ];
    const microphones=[
      {name:"Arctis Nova Pro Mic",sub:"Steelseries · Microphone",vol:100,kind:"mic"},
      {name:"DJI MIC MINI",sub:"DJI · Wireless microphone",state:"override",status:"MANUAL OVERRIDE",vol:62,kind:"mic"}
    ];
    const qs=s=>document.querySelector(s);
    const icon=kind=>{
      const paths={
        headphones:'<path d="M5 18v-4a11 11 0 0 1 22 0v4M5 17h5v10H7a2 2 0 0 1-2-2zM27 17h-5v10h3a2 2 0 0 0 2-2z"/>',
        mic:'<rect x="11" y="3" width="10" height="18"/><path d="M7 15v1a9 9 0 0 0 18 0v-1M16 25v4M11 29h10"/>',
        screen:'<rect x="3" y="5" width="26" height="18"/><path d="M12 28h8M16 23v5"/>',
        speaker:'<path d="M6 12h6l8-7v22l-8-7H6zM24 11a8 8 0 0 1 0 10"/>'
      };
      return `<span class="glyph" aria-hidden="true"><svg viewBox="0 0 32 32">${paths[kind]||paths.speaker}</svg></span>`;
    };
    const actionButton=(path,label,dir="")=>`<button class="icon-btn ${label==="Remove"?"remove":"move"}" ${dir?`data-dir="${dir}"`:""} aria-label="${label}"><svg viewBox="0 0 20 20"><path d="${path}"/></svg></button>`;
    const rankActions=()=>`<div class="row-actions">${actionButton("M4 12l6-6 6 6","Move up","-1")}${actionButton("M4 8l6 6 6-6","Move down","1")}${actionButton("M5 5l10 10M15 5L5 15","Remove")}</div>`;
    const priorityRow=(d,i)=>`<article class="device-row ${d.state||""}" tabindex="0"><span class="rank">${i+1}</span>${icon(d.kind)}<div class="device-name"><strong>${d.name}${d.status?`<span class="badge">${d.status}</span>`:""}</strong><small>${d.sub}</small></div>${rankActions()}</article>`;
    const mixerRow=(d,i)=>`<article class="device-row mixer-row ${d.state||""}" tabindex="0"><span class="rank">${i+1}</span>${icon(d.kind)}<div class="device-name"><strong>${d.name}${d.status?`<span class="badge">${d.status}</span>`:""}</strong><small>${d.sub}</small></div>${d.state==="offline"?'<div class="mix-control unavailable">Unavailable</div><span class="percent">--</span><button class="mute" disabled>Mute</button>':`<div class="mix-control"><input type="range" min="0" max="100" value="${d.vol}" aria-label="${d.name} volume"></div><span class="percent">${d.vol}%</span><button class="mute">Mute</button>`}</article>`;
    const block=(title,items,mode)=>`<section class="section"><div class="section-head"><h2>${title}</h2><span>${items.length} ranked</span></div><div class="rows">${items.map((d,i)=>mode==="mixer"?mixerRow(d,i):priorityRow(d,i)).join("")}</div>${mode==="priority"?'<button class="add-device">+ Add a device (2 more)</button>':""}</section>`;
    qs("#priority").innerHTML=`${block("OUTPUTS",outputs,"priority")}${block("MICROPHONES",microphones,"priority")}<div class="legend" aria-label="State legend"><span><i class="swatch"></i>Automatic in use</span><span><i class="swatch manual"></i>Manual override</span></div>`;
    qs("#mixer").innerHTML=`${block("OUTPUTS",outputs,"mixer")}${block("MICROPHONES",microphones,"mixer")}`;
    const all=[...outputs,...microphones,{name:"Realtek Digital Output",sub:"Realtek · Disabled endpoint",state:"disabled-device",kind:"speaker",disabled:true}];
    const types=["Speakers","Headphones","Headset","TV"];
    qs("#devices").innerHTML=`<div class="remembered"><span>Show remembered devices (31)</span><button class="switch" role="switch" aria-checked="false" aria-label="Show remembered devices"></button></div><section class="section"><div class="section-head"><h2>ALL ENDPOINTS</h2><span>${all.length} found</span></div><div class="rows">${all.map((d,i)=>`<article class="device-row device-manage ${d.state||""}" tabindex="0">${icon(d.kind)}<div class="device-name"><strong>${d.name}</strong><small>${d.sub}</small></div><select aria-label="${d.name} device type">${types.map((type,n)=>`<option ${n===i%4?"selected":""}>${type}</option>`).join("")}</select><button class="text-btn rename">Rename</button><button class="text-btn disable">${d.disabled?"Enable":"Disable"}</button></article>`).join("")}</div></section>`;
    const flash=message=>{
      const toast=qs(".toast");
      toast.textContent=message;
      toast.classList.add("show");
      clearTimeout(window.toastTimer);
      window.toastTimer=setTimeout(()=>toast.classList.remove("show"),1300);
    };
    document.querySelectorAll(".tab").forEach(tab=>tab.addEventListener("click",()=>{
      document.querySelectorAll(".tab").forEach(item=>{item.classList.remove("active");item.setAttribute("aria-selected","false")});
      document.querySelectorAll(".page").forEach(page=>page.classList.remove("active"));
      tab.classList.add("active");
      tab.setAttribute("aria-selected","true");
      qs(`#${tab.dataset.page}`).classList.add("active");
    }));
    document.addEventListener("input",event=>{
      if(event.target.type==="range")event.target.closest(".device-row").querySelector(".percent").textContent=`${event.target.value}%`;
    });
    document.addEventListener("click",event=>{
      const button=event.target.closest("button");
      if(!button)return;
      if(button.classList.contains("switch")){
        button.classList.toggle("on");
        button.setAttribute("aria-checked",String(button.classList.contains("on")));
      }
      if(button.classList.contains("mute")){
        button.classList.toggle("on");
        button.textContent=button.classList.contains("on")?"Muted":"Mute";
      }
      if(button.classList.contains("rename")){
        const name=button.closest(".device-row").querySelector("strong");
        const value=prompt("Rename this Windows device",name.textContent);
        if(value&&value.trim()){name.textContent=value.trim();flash("Device renamed");}
      }
      if(button.classList.contains("disable")){
        button.textContent=button.textContent==="Enable"?"Disable":"Enable";
        flash("Device setting updated");
      }
      if(button.classList.contains("add-device"))flash("Device picker opened");
      if(button.classList.contains("remove"))flash("Device removed from ranking");
      if(button.classList.contains("move")){
        const row=button.closest(".device-row");
        const sibling=button.dataset.dir==="-1"?row.previousElementSibling:row.nextElementSibling;
        if(sibling){
          if(button.dataset.dir==="-1")row.parentNode.insertBefore(row,sibling);
          else row.parentNode.insertBefore(sibling,row);
          row.parentNode.querySelectorAll(".rank").forEach((rank,index)=>rank.textContent=index+1);
        }
      }
    });
  </script>
</body>
</html>
