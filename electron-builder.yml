# electron-builder configuration: Windows NSIS installer + portable exe.
# The helper executables ship as extraResources (outside the asar) so the
# daemon can spawn them; electron/binaries.ts resolves these paths at runtime.
# The Equalizer APO setup rides along for the same reason: the end user should
# never have to go and find a second tool for AudioDeck's own features to work.
# Run scripts/check-bundle-inputs.mjs (wired into `npm run dist`) before
# building so a missing helper fails with a clear message.

appId: com.audiodeck.app
productName: AudioDeck
directories:
  output: dist
files:
  - out/**
  - package.json
  - "!node_modules/**"
asar: true
extraResources:
  - from: audioctl/bin/x64/Release/net8.0/win-x64/publish/audioctl.exe
    to: bin/audioctl.exe
  - from: vendor/headsetcontrol.exe
    to: vendor/headsetcontrol.exe
  - from: vendor/equalizerapo-setup.exe
    to: vendor/equalizerapo-setup.exe
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Adds the audio-effects page and runs Equalizer APO's setup from inside our
  # own wizard, so the user never opens a second installer.
  include: build/installer.nsh
  artifactName: ${productName}-Setup-${version}.${ext}
portable:
  artifactName: ${productName}-Portable-${version}.${ext}
